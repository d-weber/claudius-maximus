# Tests on the three OSes + a PyInstaller smoke build of the desktop app + both firmware builds.
name: ci

# Branch pushes are covered by the pull_request run (a push to a PR branch used to run everything twice).
# Docs-only changes run nothing.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: host/pyproject.toml
      - name: Install
        # --prefer-binary: an older wheel beats a newer sdist (cryptography from source costs minutes on macOS x64)
        run: python -m pip install --prefer-binary -e host "pyinstaller>=6.10"
      - name: Unit tests
        run: python -m unittest discover -s host/tests -v
      - name: Sprite sheets
        # the sheets are hand-edited masters: fail here, not only in the firmware job, when one is invalid
        run: python tools/sprites.py check
      - name: Icons
        run: python packaging/make_icons.py
      - name: PyInstaller build
        run: pyinstaller --noconfirm packaging/claudius-maximus.spec
      - name: Smoke test the frozen binary
        run: |
          case "$RUNNER_OS" in
            Windows) BIN=dist/ClaudiusMaximus/ClaudiusMaximus.exe ;;
            macOS)   BIN="dist/Claudius Maximus.app/Contents/MacOS/claudius-maximus" ;;
            *)       BIN=dist/claudius-maximus/claudius-maximus ;;
          esac
          # `status` exits 1 when no daemon runs (as on CI); anything else is a crash.
          set +e; "$BIN" status > status.txt 2>&1; rc=$?; set -e
          cat status.txt
          [ "$rc" -le 1 ] && grep -q "daemon" status.txt
          # The Claude Code hook fast path must always exit 0, even with no daemon.
          echo '{"hook_event_name":"Stop","session_id":"ci"}' | "$BIN" hook
      - name: Upload the build (for manual testing)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: dist/
          retention-days: 7

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          # incremental build: SCons rebuilds only what changed since the last cached build
          path: firmware/.pio
          key: pio-build-${{ hashFiles('firmware/platformio.ini', 'firmware/src/**', 'firmware/include/**', 'firmware/assets/**') }}
          restore-keys: pio-build-
      - name: Install PlatformIO
        # Pillow: the pre-build hook (tools/sprites_prebuild.py) generates the sprite tables with it
        run: python -m pip install "platformio>=6.1" pillow
      - name: Build the firmware
        run: pio run -d firmware -e companion
