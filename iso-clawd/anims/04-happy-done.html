<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>04 Happy Done</title>
<script src="../lib/iso.js"></script>
</head>
<body>
<script>
const { C, SPOT } = Iso;

// ---- poses -----------------------------------------------------------------
// 'raise' = custom straight-up screen-right arm (the lib's right-side 'up' reads as sideways in iso).
const YAY = { l: 'up', r: 'raise' }, YAY2 = { l: 'waveB', r: 'raise2' }; // \o/ (two flail variants)
const HAPPY = { eyes: { shape: 'happy' }, mouth: 'laugh', blush: true, arms: YAY };
const P = (o) => Object.assign({}, HAPPY, o);
// One entry per frame (24 frames @10fps = 2.4 s). z = lift px, sq = squash.
const F = [
  /* 0  */ { eyes: 'open', arms: 'out', z: 0 },                                         // neutral
  /* 1  */ { eyes: { shape: 'closed' }, mouth: 'smile', arms: 'down', sq: 2, z: 0 },    // crouch...
  /* 2  */ { eyes: { shape: 'closed' }, mouth: 'smile', arms: 'down', sq: 5, z: 0 },    // ...deeper
  /* 3  */ P({ sq: -4, z: 6 }),                                                          // LAUNCH
  /* 4  */ P({ z: 15 }),                                                                 // apex (confetti)
  /* 5  */ P({ z: 17, arms: YAY2 }),
  /* 6  */ P({ z: 9, sq: -2 }),
  /* 7  */ P({ z: 0, sq: 6, arms: 'high' }),                                             // SPLAT
  /* 8  */ P({ z: 0, sq: 2 }),
  /* 9  */ P({ z: 6, sq: -3 }),                                                          // hop 2
  /* 10 */ P({ z: 10, arms: YAY2 }),
  /* 11 */ P({ z: 6 }),
  /* 12 */ P({ z: 0, sq: 4, arms: 'high' }),
  /* 13 */ P({ z: 3, sq: -2 }),                                                          // hop 3
  /* 14 */ P({ z: 5, arms: YAY2 }),
  /* 15 */ P({ z: 2 }),
  /* 16 */ P({ z: 0, sq: 2, arms: 'high' }),
  /* 17 */ { eyes: { shape: 'wink' }, mouth: 'smile', blush: true, arms: { l: 'high', r: 'raise' }, z: 0, sq: -1 }, // proud
  /* 18 */ { eyes: { shape: 'wink' }, mouth: 'smile', blush: true, arms: { l: 'high', r: 'raise' }, z: 0 },
  /* 19 */ { eyes: { shape: 'wink' }, mouth: 'smile', blush: true, arms: { l: 'high', r: 'raise' }, z: 0 },
  /* 20 */ { eyes: { shape: 'wink' }, mouth: 'smile', blush: true, arms: { l: 'high', r: 'raise' }, z: 0 },
  /* 21 */ { eyes: 'open', mouth: 'smile', blush: true, arms: 'out', z: 0 },
  /* 22 */ { eyes: 'open', mouth: 'none', arms: 'out', z: 0 },
  /* 23 */ { eyes: 'open', arms: 'out', z: 0 },                                         // neutral (chains to idle)
];

// Mug hops in sympathy, one frame late and smaller.
const MUG_Z = [0, 0, 0, 0, 5, 10, 7, 0, 0, 0, 4, 6, 2, 0, 0, 2, 0, 0, 0, 0, 0, 0, 0, 0];

// Sparkles popping round the head: [frame born, dx, dy (from head), color]. Life = 4 frames.
const SPARKS = [
  [4, -36, -6, 'amber'], [4, 36, 0, 'text'],
  [6, 40, -14, 'orangeLight'], [7, -40, 6, 'amber'],
  [9, -30, -16, 'text'], [10, 38, 6, 'amber'],
  [12, -38, -8, 'orangeLight'], [13, 32, -16, 'text'],
  [16, 36, -4, 'amber'], [17, -36, 2, 'text'],
];
const SPARK_SIZE = [1, 3, 2, 1];

// Confetti: burst from above the head at frame 4, deterministic ballistic pixels.
const CONF_COLORS = ['amber', 'orangeLight', 'text', 'green', 'violet', 'blueLight', 'blush'];
const CONF = [];
for (let k = 0; k < 18; k++) {
  const vx = [-6, -5, -4, -2, -1, 1, 2, 4, 5, 6, -7, 7, -3, 3, -1, 1, -5, 5][k];
  const vy = [-3, -4, -5, -5, -4, -4, -5, -4, -3, -3, -2, -2, -3, -3, -5, -5, -1, -1][k];
  CONF.push({ vx, vy, c: CONF_COLORS[k % CONF_COLORS.length], ph: k % 2 });
}
const CONF_START = 4, CONF_ORIGIN = { x: 120, y: 16 };

function drawConfetti(ctx, i) {
  const k = i - CONF_START;
  if (k < 0 || k > 12) return;
  for (const p of CONF) {
    // gravity 1 px/frame^2, horizontal drag after 4 frames
    const kx = Math.min(k, 4) + Math.max(0, k - 4) * 0.4;
    const x = Math.round(CONF_ORIGIN.x + p.vx * kx);
    const y = Math.round(CONF_ORIGIN.y + p.vy * k + (k * k) * 0.5);
    if (y > 104) continue;
    // flutter: alternate between a 2x1 and 1x2 chip
    const flat = ((k + p.ph) & 1) === 0;
    Iso.rect(ctx, x, y, flat ? 2 : 1, flat ? 1 : 2, C[p.c]);
  }
}

// Clawd with an optional straight-up screen-right arm. A probe draw on a scratch canvas gives the
// 'out' hand anchor; the real draw uses r:'none' and adds an upright arm box at the shoulder.
const scratch = document.createElement('canvas'); scratch.width = 240; scratch.height = 121;
const sctx = scratch.getContext('2d');
function drawClawdX(ctx, o) {
  const r = o.arms && o.arms.r;
  if (r !== 'raise' && r !== 'raise2') return Iso.drawClawd(ctx, o);
  const probe = Iso.drawClawd(sctx, Object.assign({}, o, { arms: { l: o.arms.l, r: 'out' } }));
  const a = Iso.drawClawd(ctx, Object.assign({}, o, { arms: { l: o.arms.l, r: 'none' } }));
  const h = probe.hand.r;
  const tall = r === 'raise' ? 21 : 18, dx = r === 'raise' ? 0 : 2;
  const bx = h.x + 2 + dx, by = h.y - 7;
  Iso.box(ctx, bx, by, 0, 2, 2, tall, Iso.SHADE.orange);
  a.hand.r = { x: bx, y: by - tall };
  return a;
}

// Green "done" badge with a dark check, centred. pop: 0 = small, 1 = big (overshoot), 2 = normal.
function doneBadge(ctx, x, y, pop) {
  if (pop === 0) { Iso.fx.check(ctx, x, y, C.green); return; }
  const big = pop === 1;
  const rows = big
    ? ['..ggggggg..', '.ggggggggg.', 'ggggggggddg', 'gggggggddgg', 'gddgggddggg', 'ggddgddgggg', 'gggdddggggg', '.gggdgggggg', '..ggggggg..']
    : ['..ggggg..', '.gggggdg.', 'ggggggddg', 'gddgdddgg', 'ggdddgggg', 'gggdggggg', '.ggggggg.', '..ggggg..'];
  const s = rows;
  Iso.sprite(ctx, x - (s[0].length >> 1), y - (s.length >> 1), s, { g: C.green, d: C.bg });
}

Iso.player({
  name: '04-happy-done',
  fps: 10,
  frames: F.length,
  loop: false,
  notes: 'DONE! one-shot, 24 frames @10 fps (2.4 s), ends on neutral. Two-frame anticipation crouch, ' +
    'a big launch into "\\o/" with ^ ^ eyes, laugh and blush, then three diminishing hops with squash on each landing. ' +
    'A green check badge pops over his head with a confetti burst at the first apex, and sparkles pop around him. ' +
    '<b>Gags:</b> the coffee mug hops along one frame late; he lands in a proud one-arm-up pose with a wink and a glint, then settles.',
  draw(ctx, i) {
    Iso.drawDesk(ctx);

    // the mug on its spot; it hops too
    const mz = MUG_Z[i];
    Iso.prop.mug(ctx, SPOT.mug.x, SPOT.mug.y, { frame: i, steam: mz === 0, z: mz });
    if (mz >= 5) Iso.fx.ticks(ctx, SPOT.mug.x, SPOT.mug.y - 20 - mz, 'up', C.muted);

    const f = F[i];
    const a = drawClawdX(ctx, {
      x: SPOT.clawd.x, y: SPOT.clawd.y, z: f.z, squash: f.sq || 0,
      eyes: f.eyes, mouth: f.mouth || 'none', blush: !!f.blush, arms: f.arms, legs: 'stand',
    });

    // take-off / landing dust
    if (i === 3) { Iso.fx.ticks(ctx, a.feet.x - 22, a.feet.y + 2 - f.z, 'left', C.muted); Iso.fx.ticks(ctx, a.feet.x + 22, a.feet.y + 2 - f.z, 'right', C.muted); }
    if (i === 7 || i === 8) {
      const d = i === 7 ? 0 : 1;
      Iso.fx.poof(ctx, a.feet.x - 26 - d * 2, a.feet.y + 2, d + 1, C.dim);
      Iso.fx.poof(ctx, a.feet.x + 26 + d * 2, a.feet.y + 2, d + 1, C.dim);
    }

    // green check badge above head (pops in at apex, bobs with him, fades by shrinking)
    if (i >= 4 && i <= 20) {
      const pop = i === 4 ? 0 : i === 5 ? 1 : (i >= 19 ? 0 : 2);
      const bob = (i >= 6 && i <= 18) ? ((i >> 1) & 1) : 0;
      doneBadge(ctx, a.head.x, a.head.y - 9 - bob, pop);
    }

    // sparkles
    for (const [b, dx, dy, col] of SPARKS) {
      const k = i - b;
      if (k >= 0 && k < SPARK_SIZE.length) Iso.fx.sparkle(ctx, a.head.x + dx, a.head.y + 14 + dy, SPARK_SIZE[k], C[col]);
    }

    drawConfetti(ctx, i);

    // wink glint at the closed (right) eye during the proud pose
    if (i >= 17 && i <= 20) {
      const e = a.eyes.r;
      Iso.fx.sparkle(ctx, e.x + 9, e.y - 7, [1, 3, 2, 1][i - 17], C.text);
    }
  },
});
</script>
</body>
</html>
