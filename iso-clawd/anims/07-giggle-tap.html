<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>07 Giggle Tap</title>
<script src="../lib/iso.js"></script>
</head>
<body>
<script>
const { C, SPOT } = Iso;

// Giggle face pieces
const GIG = { eyes: { shape: 'happy' }, mouth: 'laugh', blush: true };
const L_UP = { l: 'high', r: 'out' }, R_UP = { l: 'out', r: 'high' };

// One entry per frame (one-shot, 14 frames @ 10 fps = 1.4 s).
// finger: tip offset above the top face (null = gone). he: 'l'|'r' giggle text side. hearts: start frame used for rise.
const FRAMES = [
  // 0 anticipation: fingertip descends, Clawd glances up
  { pose: { eyes: { shape: 'open', gazeY: -2 }, mouth: 'none' }, finger: 12 },
  // 1 POKE: contact, squash
  { pose: { eyes: { shape: 'wince' }, mouth: 'o', squash: 3 }, finger: 0, ticks: true },
  // 2 deeper press
  { pose: { eyes: { shape: 'wince' }, mouth: 'wobbly', squash: 5, arms: { l: 'up', r: 'up' } }, finger: 0, ticks: true },
  // 3 rebound: stretch, eyes wide, finger retreats
  { pose: { eyes: { shape: 'wide' }, mouth: 'o', squash: -3, z: 2, legs: 'stepA' }, finger: 14 },
  // 4..9 giggle hops with alternating arm flaps
  { pose: Object.assign({ arms: L_UP, z: 7, legs: 'stepA' }, GIG) },
  { pose: Object.assign({ arms: R_UP, squash: 2 }, GIG), he: 'r' },
  { pose: Object.assign({ arms: L_UP, z: 6, legs: 'stepB' }, GIG) },
  { pose: Object.assign({ arms: R_UP, squash: 2 }, GIG), he: 'l' },
  { pose: Object.assign({ arms: L_UP, z: 4, legs: 'stepA' }, GIG) },
  { pose: Object.assign({ arms: R_UP, squash: 1, shake: 1 }, GIG), he: 'r' },
  // 10..11 giggle winds down: wiggle, then a satisfied squint
  { pose: Object.assign({ arms: 'out', shake: -1 }, GIG) },
  { pose: { eyes: { shape: 'happy' }, mouth: 'smile', blush: true } },
  // 12 eyes reopen, content smile
  { pose: { eyes: { shape: 'blink' }, mouth: 'smile' } },
  // 13 neutral (+ content smile)
  { pose: { eyes: { shape: 'open' }, mouth: 'smile' } },
];

// Pixel fingertip coming straight down from the top of the stage; tip at (x, tipY).
function finger(ctx, x, tipY) {
  const w = 11, x0 = x - 5, bodyBot = tipY - 4;
  if (bodyBot > 0) {
    Iso.rect(ctx, x0, 0, w, bodyBot, C.muted);                 // outline
    Iso.rect(ctx, x0 + 1, 0, w - 2, bodyBot, C.paper);         // skin
    Iso.rect(ctx, x0 + w - 3, 0, 2, bodyBot, C.paperShade);    // shaded side
    Iso.rect(ctx, x0 + 1, 0, 1, bodyBot, C.text);              // highlight
    if (bodyBot - 12 > 0) Iso.rect(ctx, x0 + 3, bodyBot - 12, 4, 1, C.paperShade); // knuckle crease
    if (bodyBot - 14 > 0) Iso.rect(ctx, x0 + 4, bodyBot - 14, 3, 1, C.paperShade);
  }
  Iso.sprite(ctx, x0, tipY - 4, [
    'mhppppppssm',
    'mhppppppssm',
    '.mppppppsm.',
    '..mmmmmmm..',
  ], { m: C.muted, p: C.paper, s: C.paperShade, h: C.text });
}

Iso.player({
  name: '07-giggle-tap',
  fps: 10,
  frames: FRAMES.length,
  loop: false,
  notes: 'One-shot, 14 frames @ 10 fps (1.4 s). A pixel fingertip drops from the top of the screen and pokes Clawd on the head: ' +
    'he squashes with &gt; &lt; eyes, springs back wide-eyed, then breaks into a ticklish giggle: ^ ^ eyes, laugh mouth, blush, ' +
    'alternating arm flaps and three tiny hops while "HE" pops out on alternating sides and hearts float up. ' +
    'Gag: the poke deforms him like a squeaky toy and he cannot hold it together. Ends on the neutral pose with a content smile.',
  draw(ctx, i) {
    const F = FRAMES[i];
    Iso.drawDesk(ctx);
    Iso.prop.mug(ctx, SPOT.backRight.x, SPOT.backRight.y, { frame: i, steam: true });

    const a = Iso.drawClawd(ctx, Object.assign({ x: SPOT.clawd.x, y: SPOT.clawd.y, arms: 'out', legs: 'stand' }, F.pose));

    // fingertip (lands slightly toward the face side of the top)
    if (F.finger != null) finger(ctx, a.top.x - 2, a.top.y - F.finger);
    if (F.ticks) {
      Iso.fx.ticks(ctx, a.top.x - 16, a.top.y - 2, 'left', C.text);
      Iso.fx.ticks(ctx, a.top.x + 12, a.top.y - 2, 'right', C.text);
    }

    // giggle text
    if (F.he === 'l') Iso.text(ctx, a.head.x - 30, a.head.y - 2, 'HE', C.amber);
    if (F.he === 'r') Iso.text(ctx, a.head.x + 22, a.head.y - 4, 'HE', C.amber);

    // hearts rising from frame 5
    if (i >= 5 && i <= 12) {
      const k = i - 5;
      Iso.fx.heart(ctx, SPOT.clawd.x + 30 + (k & 1), 36 - k * 3, k < 1 ? 1 : 2, C.red);
      if (k >= 2 && k <= 7) Iso.fx.heart(ctx, SPOT.clawd.x - 44 - ((k + 1) & 1), 38 - (k - 2) * 3, k < 3 ? 1 : 2, C.blush);
    }
    // little sparkle as he settles
    if (i === 11 || i === 12) Iso.fx.sparkle(ctx, a.head.x + 16, a.head.y + 2, i === 11 ? 2 : 1, C.amber);
  },
});
</script>
</body>
</html>
