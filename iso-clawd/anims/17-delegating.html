<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Delegating</title>
<script src="../lib/iso.js"></script>
</head>
<body>
<script>
const { C, SHADE } = Iso;

// ---------------------------------------------------------------- layout
const P = 48;                                   // loop length (frames, 12 fps = 4 s); divisible by 1..4
const N = Math.max(1, Math.min(4, parseInt(new URLSearchParams(location.search).get('n'), 10) || 3));
const STEP = P / N;                             // spawn interval
const BOSS = { x: 138, y: 62 };                 // Clawd, the foreman (back-right, facing left, eyes on the lane)
const S = { x: 62, y: 68 };                     // spawn point (left wing)
const lane = (t) => ({ x: S.x + 2 * t, y: S.y + t });   // long down-right lane across the front, minis face right
const END_T = 24;                               // normal hand-off spot
const BONK_T = 29;                              // where the rookie hits the mug
const RECOIL_T = 25;                            // where it lands on its bottom
const TRAY = { x: 138, y: 80 };                 // outbox, behind the lane (no-look toss over the head)
const MUG = lane(33);                           // mug on the lane's continuation

// tiny sheet of paper carried over the head / flying
const PAPER = ['..pppppp', '.pkkkkpp', 'pkkkpps.', 'pppppss.'];
const drawPaper = (ctx, x, y) => Iso.sprite(ctx, x - 4, y - 2, PAPER, { p: C.paper, k: C.paperShade, s: C.muted });

// ---------------------------------------------------------------- mini timelines (local frame f)
// A state: {x, y, z, facing, legs, arms, eyes, mouth, squash, shake, blush, paper:{dx,dy}|null, fly, poof,
// FX flags} | {poofOnly: n} | null (gone).
const ARC = [{ u: 0.25, h: 8 }, { u: 0.6, h: 9 }, { u: 0.9, h: 4 }];   // toss arc samples (u along, h up)

const TOSS = [0, 1, 2, 3, 4, 4, 5, 6, 7, 8];     // toss phase keys with holds (10 frames)
function tossState(t, j, extra) {      // no-look toss over the head into the outbox, hop, poof
  const k = TOSS[j], p = lane(t);
  if (k == null) return null;
  const st = Object.assign({ x: p.x, y: p.y, facing: 'right', legs: 'stand', paper: null, from: p }, extra);
  if (k === 0) return Object.assign(st, { squash: 2, arms: 'up', eyes: { shape: 'open', gazeY: -1 }, paper: { dy: 2 } });
  if (k <= 3) return Object.assign(st, { squash: k === 1 ? -3 : 0, arms: k === 1 ? 'up' : 'out', eyes: k === 1 ? 'closed' : 'happy', fly: ARC[k - 1] });
  if (k === 4) return Object.assign(st, { z: 4, arms: 'up', eyes: 'happy', mouth: 'o', landed: true, sweat: false });
  if (k === 5) return Object.assign(st, { z: 1, arms: 'up', eyes: 'happy', landed: true, sweat: false });
  if (k === 6) return Object.assign(st, { squash: 3, arms: 'out', eyes: 'happy', poof: 0, landed: true, sweat: false });
  if (k === 7) return { poofOnly: 2, x: p.x, y: p.y };
  return { poofOnly: 3, x: p.x, y: p.y };
}

function spawnState(f, eager) {
  if (f === 0) return { poofOnly: 1, x: S.x, y: S.y };
  const st = { x: S.x, y: S.y, facing: 'right', legs: 'stand', arms: 'up', paper: {}, poof: f === 1 ? 2 : f === 2 ? 3 : null };
  if (f === 1) return Object.assign(st, { squash: 3, eyes: 'wide' });
  // f 2..3: normal minis salute the boss; the eager rookie crouches to sprint
  if (eager) return Object.assign(st, { squash: 3, legs: 'stepA', eyes: { shape: 'wide', gazeX: 1 }, mouth: 'flat' });
  return Object.assign(st, { arms: { l: 'out', r: 'high' }, eyes: 'happy', salute: true });
}

const WALK0 = 4, WALK_N = END_T / 2;            // scurry: 2 steps per frame
function normalMini(f) {
  if (f < WALK0) return spawnState(f, false);
  if (f < WALK0 + WALK_N) {
    const n = f - WALK0, p = lane(2 * (n + 1));
    return { x: p.x, y: p.y, facing: 'right', legs: n % 2 ? 'stepA' : 'stepB', arms: 'up',
             eyes: { shape: 'open', gazeX: 1 }, paper: { dy: n % 2 ? -1 : 0 } };
  }
  return tossState(END_T, f - WALK0 - WALK_N, {});
}

function gagMini(f) {                 // the eager rookie: sprints past the hand-off and bonks the mug
  if (f < WALK0) return spawnState(f, true);
  if (f < 8) {                        // sprint t = 6, 13, 20, 26
    const t = [6, 13, 20, 26][f - 4], p = lane(t);
    return { x: p.x, y: p.y, facing: 'right', legs: f % 2 ? 'stepA' : 'stepB', arms: 'up', squash: -3,
             eyes: { shape: 'open', gazeX: 1, gazeY: 1 }, paper: { dx: -2, dy: -1 }, ticks: true };
  }
  const B = lane(BONK_T), R = lane(RECOIL_T);
  const st = { x: R.x, y: R.y, facing: 'right', legs: 'stand' };
  if (f === 8) return Object.assign(st, { x: B.x, y: B.y, squash: 3, shake: 1, eyes: 'wince', mouth: 'o', arms: 'up', paper: { dy: -8 }, bonk: true });
  if (f === 9) return Object.assign(st, { x: lane(RECOIL_T + 2).x, y: lane(RECOIL_T + 2).y, z: 5, squash: -3, eyes: 'wince', mouth: 'o', arms: 'high', paper: { dy: -14 }, bonk: true });
  if (f === 10) return Object.assign(st, { legs: 'sit', eyes: 'wince', mouth: 'o', arms: 'up', paper: { dy: -10 } });
  if (f <= 12) return Object.assign(st, { legs: 'sit', eyes: 'closed', arms: 'out', paper: { dy: f === 11 ? -4 : 0 }, stars: true });
  if (f === 13) return Object.assign(st, { legs: 'sit', eyes: { shape: 'open', gazeX: -1, gazeY: -2 }, arms: 'out', paper: {}, question: true });
  if (f === 14) return Object.assign(st, { squash: -3, eyes: { shape: 'wide', gazeX: -1, gazeY: -2 }, arms: 'up', paper: {}, sweat: true });
  if (f <= 17) return Object.assign(st, { eyes: 'happy', arms: { l: 'out', r: 'high' }, paper: {}, salute: true, blush: f >= 16 });
  return tossState(RECOIL_T, f - 18, { sweat: true });   // sheepish toss from where it stands
}

function minisAt(i) {
  const out = [];
  for (let k = 0; k < N; k++) {
    const f = (((i - k * STEP) % P) + P) % P;
    const st = k === 0 ? gagMini(f) : normalMini(f);
    if (st) out.push(Object.assign(st, { k, f }));
  }
  return out;
}

// ---------------------------------------------------------------- the boss
function bossPose(i) {
  const g = i;                        // the rookie spawns at frame 0
  const look = { shape: 'open', gazeX: -1, gazeY: 2 };
  const base = { x: BOSS.x, y: BOSS.y, eyes: look, legs: Iso.cycle(['stand', 'stand', 'tap'], i, 2), arms: { l: Iso.cycle(['waveA', 'waveB'], i, 3), r: 'out' } };
  if (g >= 8 && g <= 10) return Object.assign(base, { eyes: { shape: 'wide', gazeX: -1, gazeY: 2 }, mouth: 'o', arms: { l: 'up', r: 'up' }, squash: g === 8 ? -3 : 0, bang: true });
  if (g >= 11 && g <= 14) return Object.assign(base, { eyes: look, mouth: 'flat', arms: { l: g % 2 ? 'forward' : 'out', r: 'out' }, point: g % 2 === 1 });
  if (g >= 15 && g <= 17) return Object.assign(base, { eyes: 'happy', mouth: 'smile', blush: true, arms: { l: 'out', r: 'high' } });
  // conductor beat before each spawn: wind-up, then the downbeat "go!"
  for (let k = 0; k < N; k++) {
    const d = (((i - k * STEP) % P) + P) % P;
    if (d === P - 3 || d === P - 2) return Object.assign(base, { arms: { l: 'up', r: 'up' }, squash: -3, eyes: { shape: 'open', gazeX: -1, gazeY: -1 } });
    if (d === P - 1) return Object.assign(base, { arms: { l: 'forward', r: 'high' }, squash: 2, mouth: 'o', go: true });
    if (d === 0) return Object.assign(base, { arms: { l: 'forward', r: 'out' }, mouth: 'o' });
  }
  if (i === 38) return Object.assign(base, { eyes: 'blink' });
  return base;
}

// ---------------------------------------------------------------- drawing helpers
function drawTray(ctx, landed) {
  Iso.box(ctx, TRAY.x, TRAY.y, 0, 5, 5, 3, SHADE.metal);
  Iso.prop.paper(ctx, TRAY.x, TRAY.y, { a: 4, b: 4, z: 3, lines: false });
  Iso.prop.paper(ctx, TRAY.x, TRAY.y - 1, { a: 4, b: 4, z: 4 + (landed ? 1 : 0) });
}

function drawMini(ctx, m) {
  if (m.poofOnly != null) { Iso.fx.poof(ctx, m.x, m.y - 8, m.poofOnly, C.violetLight); return; }
  const a = Iso.drawClawd(ctx, {
    x: m.x, y: m.y, z: m.z || 0, size: 'mini', tint: 'violet', facing: m.facing, legs: m.legs || 'stand',
    arms: m.arms || 'out', eyes: m.eyes || 'open', mouth: m.mouth || 'none', squash: m.squash || 0,
    shake: m.shake || 0, blush: !!m.blush,
  });
  if (m.paper) drawPaper(ctx, a.head.x + (m.paper.dx || 0), a.head.y + (m.paper.dy || 0));
  if (m.ticks) Iso.fx.ticks(ctx, a.bbox.x - 1, a.face.y - 2, 'left', C.violetLight);
  if (m.bonk) Iso.fx.sparkle(ctx, a.bbox.x + a.bbox.w - 2, a.face.y - 6, m.f === 8 ? 3 : 2, C.amber);
  if (m.stars) {                      // two little stars circling the head
    const o = m.f % 2 ? [[-7, -3], [6, -6]] : [[-4, -7], [7, -2]];
    o.forEach(([dx, dy]) => Iso.fx.sparkle(ctx, a.head.x + dx, a.head.y + dy, 1, C.amber));
  }
  if (m.question) Iso.fx.question(ctx, a.head.x - 8, a.head.y - 10, { color: C.violetLight });
  if (m.sweat) Iso.fx.sweat(ctx, a.head.x - 7, a.head.y + 1);
  if (m.poof != null) Iso.fx.poof(ctx, m.x - 10, m.y - 6, m.poof, C.violetLight);
}

function drawFlyingPaper(ctx, m) {
  if (!m.fly) return;
  const sx = m.from.x, sy = m.from.y - 17, tx = TRAY.x, ty = TRAY.y - 8;
  drawPaper(ctx, Iso.lerp(sx, tx, m.fly.u), Iso.lerp(sy, ty, m.fly.u) - m.fly.h);
}

// ---------------------------------------------------------------- draw
function draw(ctx, i) {
  Iso.drawDesk(ctx);
  const minis = minisAt(i);
  const landed = minis.some((m) => m.landed);
  const bonk = minis.find((m) => m.bonk);

  // back to front: tray (behind the lane), boss, then the lane sorted by depth
  drawTray(ctx, landed);
  const bp = bossPose(i);
  const b = Iso.drawClawd(ctx, bp);
  const items = minis.map((m) => ({ y: m.y, d: () => drawMini(ctx, m) }));
  items.push({ y: MUG.y + 1, d: () => Iso.prop.mug(ctx, MUG.x + (bonk ? (bonk.f === 8 ? 2 : 1) : 0), MUG.y, { frame: i }) });
  items.sort((p, q) => p.y - q.y).forEach((it) => it.d());

  // FX on top
  minis.forEach((m) => drawFlyingPaper(ctx, m));
  if (landed) Iso.fx.check(ctx, TRAY.x + 16, TRAY.y - 8, C.green);
  if (bp.bang) Iso.fx.bang(ctx, b.head.x - 4, b.head.y - 8);
  if (bp.point && b.hand.l) Iso.fx.ticks(ctx, b.hand.l.x - 2, b.hand.l.y, 'left', C.orangeLight);
  if (bp.go && b.hand.l) Iso.fx.sparkle(ctx, b.hand.l.x - 6, b.hand.l.y - 2, 2, C.violetLight);
}

Iso.player({
  name: '17-delegating',
  fps: 12,
  frames: P,
  loop: true,
  draw,
  notes: 'Delegating to subagents (Task/Agent). 48-frame loop at 12 fps (4 s). Clawd the foreman taps his foot and conducts from the back: ' +
    'a wind-up and a downbeat "go!" each time a violet mini helper poofs in on the left wing. ' +
    'Each mini salutes, scurries down the lane with a paper on its head, does a no-look toss over its head into the outbox ' +
    '(green check), a happy hop and poofs away. Gag: the eager rookie (first mini each loop) sprints past the hand-off ' +
    'with speed lines and bonks into the mug (paper flies up, mug rattles, Clawd "!"). It bounces onto its bottom, sees stars and a "?". Clawd points, ' +
    'they trade salutes and blushes, and the rookie makes a sheepish, sweaty toss from where it stands. ' +
    '<code>?n=1..4</code> sets the helper count (default 3).',
});
</script>
</body>
</html>
