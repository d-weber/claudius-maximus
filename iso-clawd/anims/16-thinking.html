<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>16 Thinking</title>
<script src="../lib/iso.js"></script>
</head>
<body>
<script>
const { C, SPOT } = Iso;

// ---------------------------------------------------------------- local sprites
const GEAR = [
  ['....#....', '..#####..', '.##...##.', '.#.....#.', '##..#..##', '.#.....#.', '.##...##.', '..#####..', '....#....'],
  ['.#.....#.', '..#####..', '.##...##.', '##.....##', '.#..#..#.', '##.....##', '.##...##.', '..#####..', '.#.....#.'],
]
const QMARK = ['.###.', '#...#', '...#.', '..#..', '.....', '..#..'];
const SQUIG = [
  ['.#...#...#.', '#.#.#.#.#.#', '...#...#...'],
  ['#...#...#..', '.#.#.#.#.#.', '..#...#...#'],
];
// light bulb, 9 wide x 13 tall. g = glass, h = highlight, o = outline, b = base, d = base dark
const BULB = [
  '..ooooo..',
  '.ohggggo.',
  'ohhgggggo',
  'ohggggggo',
  'ogggggggo',
  'ogggggggo',
  '.ogggggo.',
  '..ogggo..',
  '...ogo...',
  '..bbbbb..',
  '..ddddd..',
  '..bbbbb..',
  '...ddd...',
];

function bulb(ctx, x, y, state) {
  // state: 'off' | 'dim' | 'on'
  const map = {
    off: { o: C.dim, g: C.surface2, h: C.muted, b: C.grey, d: C.greyDark },
    dim: { o: C.amberDark, g: C.amberDark, h: C.amber, b: C.grey, d: C.greyDark },
    on:  { o: C.amber, g: C.amber, h: C.text, b: C.greyLight, d: C.grey },
  }[state];
  Iso.sprite(ctx, x - 4, y - 6, BULB, map);
  if (state === 'on') {
    // rays
    Iso.rect(ctx, x, y - 11, 1, 3, C.amber);
    Iso.rect(ctx, x - 9, y - 2, 3, 1, C.amber);
    Iso.rect(ctx, x + 7, y - 2, 3, 1, C.amber);
    Iso.px(ctx, x - 6, y - 8, C.amber); Iso.px(ctx, x - 7, y - 9, C.amber);
    Iso.px(ctx, x + 6, y - 8, C.amber); Iso.px(ctx, x + 7, y - 9, C.amber);
  } else if (state === 'dim') {
    Iso.px(ctx, x, y - 10, C.amberDark);
    Iso.px(ctx, x - 8, y - 2, C.amberDark); Iso.px(ctx, x + 8, y - 2, C.amberDark);
  }
}

// hand-on-chin: a small voxel fist + forearm standing proud of the face (real 3D boxes so they
// read against the face). Built from face texel points, pushed out along the face normal.
function chinHand(ctx, F, facing) {
  const cols = F.cols, mid = cols >> 1, L = facing === 'left';
  const pal = Iso.SHADE.orange;
  const hi = { top: C.orangeLight, left: C.orangeLight, right: C.orange };
  // box whose footprint runs along the face (len units) and sticks out `out` units, bottom at face row vb
  const slab = (u, vb, len, out, h, p) => {
    const q = F.at(u, vb);
    const nx = L ? -out : out, ny = out >> 1;          // half the depth along the normal
    if (L) Iso.box(ctx, q.x + nx, q.y + ny, 0, len, out, h, p);
    else Iso.box(ctx, q.x + nx, q.y + ny, 0, out, len, h, p);
  };
  // forearm: from the near (front) edge of the face to the fist, low on the face
  slab(L ? cols - 8 : 8, 25, 4, 2, 3, pal);
  // fist propping the chin
  slab(L ? mid + 2 : mid - 2, 23, 3, 3, 6, hi);
}

// ---------------------------------------------------------------- timeline
// Positions along the desk's world-x axis (2 px right, 1 px down per unit).
const A = { x: 110, y: 71 }, B = { x: 132, y: 82 };
const at = (p, q, k, n) => ({ x: Iso.lerp(p.x, q.x, k / n), y: Iso.lerp(p.y, q.y, k / n) });

// Each frame: full description. Built once, draw() just indexes it (pure).
const FR = [];
const push = (n, f) => { for (let k = 0; k < n; k++) FR.push(f(k)); };
const gazeUL = { shape: 'open', gazeX: -1, gazeY: -2 };
const gazeUR = { shape: 'open', gazeX: 1, gazeY: -2 };

// 1) ponder at A: hand on chin, eyes up-left, "..." builds in the thought puff (9 f)
push(9, (k) => ({ pos: A, facing: 'left', eyes: k === 6 ? { shape: 'blink', gazeX: -1, gazeY: -2 } : gazeUL,
  chin: true, legs: k >= 4 && k < 6 ? 'tap' : 'stand', puff: 'dots', dots: Math.min(3, 1 + (k >> 1)) }));
// 2) pace to B facing right, eyes still up; gear turns in the puff (6 f)
push(6, (k) => ({ pos: at(A, B, k + 1, 6), facing: 'right', eyes: gazeUR, chin: true,
  legs: k % 2 ? 'stepB' : 'stepA', bob: k % 2 ? 0 : 1, puff: 'gear', g: k }));
// 3) stop at B: look up, foot tap, "?" in the puff (6 f)
push(6, (k) => ({ pos: B, facing: 'right', eyes: k === 3 ? { shape: 'blink', gazeX: 1, gazeY: -2 } : { shape: 'open', gazeX: 0, gazeY: -2 },
  chin: true, legs: k % 2 ? 'tap' : 'stand', squash: k === 0 ? 1 : 0, puff: 'q', q: k }));
// 4) turn, pace back to A facing left, squiggles (6 f)
push(6, (k) => ({ pos: at(B, A, k + 1, 6), facing: 'left', eyes: gazeUL, chin: true,
  legs: k % 2 ? 'stepB' : 'stepA', bob: k % 2 ? 0 : 1, puff: 'squig', g: k }));
// 5) lightbulb gag (11 f): anticipation, flicker, almost on, fizzle, deflate, back to chin
const GAG = [
  // bulb state, eyes, arms, squash, mouth, extra
  { bulb: 'off', eyes: { shape: 'open', gazeX: 0, gazeY: -2 }, chin: true },
  { bulb: 'dim', eyes: { shape: 'wide', gazeY: -1 }, chin: true },
  { bulb: 'off', eyes: { shape: 'wide', gazeY: -1 }, chin: true },
  { bulb: 'on', eyes: { shape: 'wide', gazeY: -2 }, arms: { l: 'out', r: 'up' }, squash: -3, mouth: 'o' },
  { bulb: 'on', eyes: { shape: 'wide', gazeY: -2 }, arms: { l: 'out', r: 'up' }, squash: -3, mouth: 'o', spark: true },
  { bulb: 'dim', eyes: { shape: 'wide', gazeY: -2 }, arms: { l: 'out', r: 'up' }, squash: -2, mouth: 'o' },
  { bulb: 'off', eyes: { shape: 'open', gazeY: -2 }, arms: { l: 'out', r: 'high' }, mouth: 'flat', smoke: 0 },
  { bulb: 'off', eyes: { shape: 'closed' }, arms: 'down', squash: 2, mouth: 'flat', smoke: 1 },
  { bulb: 'off', eyes: { shape: 'closed' }, arms: 'down', squash: 2, mouth: 'flat', smoke: 2 },
  { bulb: null, eyes: { shape: 'blink', gazeX: -1, gazeY: -2 }, chin: true, smoke: 3 },
  { bulb: null, eyes: gazeUL, chin: true },
];
GAG.forEach((g) => FR.push(Object.assign({ pos: A, facing: 'left', legs: 'stand' }, g)));

const N = FR.length; // 38 frames @ 10 fps = 3.8 s

Iso.player({
  name: '16-thinking',
  fps: 10,
  frames: N,
  loop: true,
  notes: 'THINKING loop (38 f @ 10 fps, 3.8 s). Clawd ponders with a fist on his chin and eyes up-left while a thought puff cycles "..." &rarr; a turning gear &rarr; "?" &rarr; squiggles. ' +
    'He paces a few steps across the desk, taps his foot, turns and paces back. ' +
    'Gag: a light bulb flickers above his head, finally pops on (he stretches up, eyes wide, arm raised), then fizzles out in a puff of smoke. He deflates and goes back to thinking.',
  draw(ctx, i) {
    const f = FR[i % N];
    Iso.drawDesk(ctx);
    Iso.prop.notepad(ctx, SPOT.right.x + 8, SPOT.right.y - 2, { lines: 3 });

    const chin = !!f.chin;
    const arms = f.arms || (chin ? (f.facing === 'left' ? { l: 'out', r: 'none' } : { l: 'none', r: 'out' }) : 'out');
    const a = Iso.drawClawd(ctx, {
      x: f.pos.x, y: f.pos.y, z: f.bob || 0, facing: f.facing, eyes: f.eyes, arms, legs: f.legs,
      squash: f.squash || 0, mouth: f.mouth || 'none',
    });
    Iso.prop.mug(ctx, SPOT.mug.x, SPOT.mug.y, { frame: i, steam: true });   // the mug spot is in front of him
    if (chin) chinHand(ctx, a.facePainter, f.facing);

    Iso.prop.pencil(ctx, SPOT.frontLeft.x - 6, SPOT.frontLeft.y + 4, { dir: 'x' });

    // thought puff: above and behind the head, on the side he looks toward
    if (f.puff) {
      const hx = a.head.x, hy = a.head.y;
      const left = f.facing === 'left';
      const pw = 28, ph = 14;
      const px0 = left ? hx - pw - 2 : hx + 4, py0 = Math.max(1, hy - ph - 9);
      const inner = Iso.fx.puff(ctx, px0, py0, pw, ph, { kind: 'thought', tail: left ? 'right' : 'left' });
      const cx = inner.x + (inner.w >> 1), cy = inner.y + (inner.h >> 1);
      if (f.puff === 'dots') Iso.fx.dots(ctx, cx + 1, cy - 1, f.dots, C.text);
      else if (f.puff === 'gear') {
        Iso.sprite(ctx, cx - 10, cy - 4, GEAR[f.g % 2], { '#': C.muted });
        Iso.sprite(ctx, cx + 1, cy - 4, GEAR[(f.g + 1) % 2], { '#': C.blueLight });
      } else if (f.puff === 'q') {
        const bobq = f.q % 2;
        Iso.sprite(ctx, cx - 7, cy - 3 - bobq, QMARK, { '#': C.amber });
        Iso.sprite(ctx, cx + 2, cy - 3 - (1 - bobq), QMARK, { '#': C.muted });
      } else if (f.puff === 'squig') Iso.sprite(ctx, cx - 5, cy - 1, SQUIG[f.g % 2], { '#': C.violetLight });
    }

    // light bulb gag
    const bx = a.head.x - 1, by = Math.max(12, a.head.y - 14);
    if (f.bulb) bulb(ctx, bx, by, f.bulb);
    if (f.spark) { Iso.fx.sparkle(ctx, bx - 10, by - 6, 2, C.amber); Iso.fx.sparkle(ctx, bx + 11, by - 1, 1, C.text); }
    if (f.smoke != null) {
      Iso.fx.poof(ctx, bx + 1, by - 11 - f.smoke * 2, f.smoke, C.grey);
      if (f.smoke < 2) { Iso.px(ctx, bx - 2, by - 7, C.dim); Iso.px(ctx, bx + 3, by - 8, C.dim); }
    }
  },
});
</script>
</body>
</html>
