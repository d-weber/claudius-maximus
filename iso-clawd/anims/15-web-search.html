<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Web Search</title>
<script src="../lib/iso.js"></script>
</head>
<body>
<script>
const { C, SPOT } = Iso;

// ---- beats (10 fps) ---------------------------------------------------------
// load:  browser spinner + "..." bubble, Clawd stares, foot taps impatiently
// tap:   he taps the window twice (window jolts)
// pop:   results pop in row by row, eyes go wide + sparkle
// yay:   happy hop
// spin:  he swats the desk globe, it spins fast
// peer:  magnifier up, globe slows... stops; "!" he found a spot
// back:  glances back at browser, which clears for the next query (loop)
const BEATS = [
  ['load', 10], ['tap', 4], ['pop', 6], ['yay', 4], ['spin', 5], ['peer', 6], ['found', 4], ['back', 1],
];
const N = Iso.seq.len(BEATS); // 40
const starts = {};
{ let s = 0; for (const [k, n] of BEATS) { starts[k] = s; s += n; } }
const beat = (i) => Iso.seq(BEATS, i);
const local = (i) => i - starts[beat(i)];

// globe angle as a pure function of i: accumulate per-frame speed
function globeSpeed(i) {
  const b = beat(i), k = local(i);
  if (b === 'spin') return k === 0 ? 0 : 3;
  if (b === 'peer') return [3, 2, 1, 1, 1, 0][k];
  if (b === 'load') return k % 3 === 0 ? 1 : 0; // lazy idle drift
  return 0;
}
function globeFrame(i) { let f = 0; for (let j = 0; j <= i; j++) f += globeSpeed(j); return f; }

const BROWSER = { x: 70, y: 74 };
const GLOBE = { x: 174, y: 80 };

// ---- custom big browser window (upright panel facing down-right, toward Clawd) ----
// state: {loading:bool, progress:0..30, results:0..3, newest:-1|idx, frame}
function browser(ctx, x, y, st) {
  const p = Iso.plane(ctx, x, y, 6, 18, 30, 'R', C.surface);
  const W = p.cols; // 36
  p.rect(0, 0, W, 4, C.surface2);
  p.rect(0, 4, 1, 26, C.surface2); p.rect(W - 1, 4, 1, 26, C.surface2); p.rect(0, 29, W, 1, C.surface2);
  p.rect(2, 1, 2, 2, C.red); p.rect(5, 1, 2, 2, C.amber); p.rect(8, 1, 2, 2, C.green);
  // address bar with query
  p.rect(3, 6, 30, 3, C.paper);
  p.px(4, 7, C.blue);
  p.rect(7, 7, 11, 1, C.ink);
  if (st.loading) {
    const sp = [[0, 0], [1, 0], [1, 1], [0, 1]][st.frame % 4];
    p.rect(29 + sp[0], 6 + sp[1], 2, 2, C.orange);
    p.rect(3, 10, st.progress, 1, C.blue);
    const n = (st.frame >> 1) % 4;
    for (let d = 0; d < n; d++) p.rect(12 + d * 5, 18, 3, 3, C.muted);
  }
  for (let r = 0; r < st.results; r++) {
    const v = 12 + r * 6;
    p.rect(3, v, [22, 16, 20][r], 2, r === st.newest ? C.amber : C.blue);
    p.rect(3, v + 3, 7, 1, C.green);
    p.rect(12, v + 3, [18, 14, 16][r], 1, C.muted);
  }
  return p;
}

// ---- hollow magnifier held up to one eye (eye stays visible through the ring) ----
function lens(ctx, cx, cy, glint) {
  const R = 8;
  // magnified eye behind the glass: a giant version of his eye (the gag)
  Iso.rect(ctx, cx - 4, cy - 7, 8, 15, C.eye);
  Iso.rect(ctx, cx - 3, cy - 6, 3, 3, C.text);
  Iso.px(ctx, cx + 2, cy + 4, C.dim);
  for (let j = -R - 1; j <= R + 1; j++) for (let i = -R - 1; i <= R + 1; i++) {
    const d = Math.sqrt(i * i + j * j);
    if (Math.abs(d - R) < 0.7) Iso.px(ctx, cx + i, cy + j, (i + j < -4) ? C.text : C.muted);
  }
  if (glint) { Iso.px(ctx, cx - 5, cy - 3, C.text); Iso.px(ctx, cx - 4, cy - 5, C.text); }
  for (let s = 0; s < 4; s++) Iso.rect(ctx, cx + 6 + 2 * s, cy + 6 + s, 2, 2, s ? C.woodRight : C.muted);
}

// ---- custom desk globe (bigger than prop.globe so the spin reads across the desk) ----
const MAP = [
  '.####......#####....##..',
  '######....########.####.',
  '.#####.....#######..###.',
  '..####......####....##..',
  '...###......####........',
  '....##.......###....###.',
  '.....#.......##....####.',
  '..............#.....##..',
];
function globe(ctx, x, y, f, pin) {
  const SH = Iso.SHADE;
  Iso.box(ctx, x, y, 0, 4, 4, 2, SH.wood);
  Iso.rect(ctx, x, y - 10, 1, 9, C.woodLeft);
  const cx = x, cy = y - 19, r = 8;
  for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
    if (i * i + j * j > r * r + 2) continue;
    const half = Math.sqrt(Math.max(1, r * r + 2 - j * j));
    const a = Math.asin(Math.max(-1, Math.min(1, i / half)));
    const lon = (Math.floor((a / Math.PI + 0.5) * 12) + f) % 24;
    const lat = Math.min(7, Math.floor((j + r) * 8 / (2 * r + 1)));
    const land = MAP[lat][(lon + 24) % 24] === '#';
    let c = land ? C.green : C.blue;
    if (i >= 5 || (i >= 3 && Math.abs(j) >= 5) || j >= 6) c = land ? C.greenDark : C.blueDark;
    else if (i <= -3 && j <= -2 && i + j <= -6) c = land ? C.green : C.blueLight;
    Iso.px(ctx, cx + i, cy + j, c);
  }
  // brass half-meridian on the right
  for (let d = -70; d <= 100; d += 6) {
    const rr = r + 2, t = d * Math.PI / 180;
    Iso.px(ctx, Math.round(cx + Math.cos(t) * rr), Math.round(cy + Math.sin(t) * rr), C.amberDark);
  }
  Iso.px(ctx, cx, cy - r - 2, C.amberDark); Iso.px(ctx, cx, cy - r - 1, C.amberDark);
  if (pin) { Iso.rect(ctx, cx - 4, cy - 6, 3, 3, C.red); Iso.px(ctx, cx - 4, cy - 6, C.blush); Iso.rect(ctx, cx - 3, cy - 3, 1, 2, C.text); }
  return { x: cx, y: cy, r };
}

Iso.player({
  name: '15-web-search',
  fps: 10,
  frames: N,
  loop: true,
  notes: 'WEB SEARCH loop, 40 frames @10 fps (4.0 s). A browser window floats beside Clawd and the page is stuck loading ' +
    '(spinner + "..." bubble); he foot-taps, then taps the glass twice and it jolts. Results pop in row by row and his eyes go ' +
    'wide with sparkles, little happy hop. Then the explorer bit: he swats the desk globe, peers at it through a magnifier as it ' +
    'slows to a stop, "!" he found a spot. Glances back as the browser clears for the next query. Gag: impatient screen tap + globe roulette.',
  draw(ctx, i) {
    const b = beat(i), k = local(i);
    Iso.drawDesk(ctx);
    Iso.prop.mug(ctx, SPOT.mug.x, SPOT.mug.y, { frame: i });

    // ---- browser (behind Clawd) ----
    let jolt = 0, st = { loading: true, progress: 0, results: 0, newest: -1, frame: i };
    if (b === 'load') st.progress = [2, 8, 14, 18, 20, 21, 22, 22, 22, 22][k]; // crawls... stalls
    if (b === 'tap') { st.progress = 22; jolt = (k === 0 || k === 2) ? -2 : 0; }
    if (b === 'pop') { st.loading = false; st.results = Math.min(3, k + 1); st.newest = k <= 2 ? k : -1; }
    if (b === 'yay' || b === 'spin' || b === 'peer' || b === 'found') { st.loading = false; st.results = 3; }
    if (b === 'back') { st.loading = k > 0; st.results = k > 0 ? 0 : 3; st.progress = 0; }
    browser(ctx, BROWSER.x + jolt, BROWSER.y + (jolt ? -1 : 0), st);

    // ---- Clawd pose ----
    const P = { eyes: { shape: 'open', gazeX: -1 }, arms: 'out', legs: 'stand', mouth: 'none' };
    if (b === 'load') {
      P.legs = (k >= 4 && k % 2 === 0) ? 'tap' : 'stand';
      P.mouth = k >= 6 ? 'flat' : 'none';
      if (k === 3) P.eyes = { shape: 'blink', gazeX: -1 };
      if (k >= 7) P.eyes = { shape: 'open', gazeX: -1, gazeY: -1 };
    } else if (b === 'tap') {
      P.arms = { l: (k === 0 || k === 2) ? 'forward' : 'high', r: 'out' };
      P.mouth = 'flat';
      P.squash = (k === 0 || k === 2) ? 1 : 0;
    } else if (b === 'pop') {
      P.eyes = { shape: 'wide', gazeX: -1, gazeY: -1 };
      P.mouth = 'o';
      P.squash = k === 0 ? -3 : 0;
      P.arms = k === 0 ? { l: 'up', r: 'up' } : 'out';
    } else if (b === 'yay') {
      P.eyes = { shape: 'happy' };
      P.mouth = 'laugh';
      P.blush = true;
      P.z = [2, 4, 4, 0][k];
      P.squash = k === 0 ? -3 : (k === 3 ? 3 : 0);
      P.arms = { l: 'high', r: 'high' };
    } else if (b === 'spin') {
      P.eyes = { shape: 'open', gazeX: 1, gazeY: 1 };
      P.arms = { l: 'out', r: k === 0 ? 'high' : (k === 1 ? 'forward' : 'out') };
      P.mouth = k >= 1 ? 'smile' : 'none';
      P.squash = k === 1 ? 2 : 0;
    } else if (b === 'peer') {
      P.eyes = { shape: 'open', gazeX: 1, gazeY: 1, l: 'open', r: 'wide' };
      P.arms = { l: 'out', r: 'out' };
      P.mouth = 'o';
    } else if (b === 'found') {
      P.eyes = { shape: 'wide', gazeX: 1, gazeY: 1 };
      P.arms = { l: 'up', r: 'out' };
      P.mouth = 'smile';
      P.blush = true;
      P.z = k === 0 ? 1 : 0;
    } else if (b === 'back') {
      P.eyes = { shape: 'open', gazeX: -1 };
    }
    const a = Iso.drawClawd(ctx, Object.assign({ x: SPOT.clawd.x, y: SPOT.clawd.y }, P));

    // ---- globe (front-right of Clawd, drawn after him) ----
    const g = globe(ctx, GLOBE.x, GLOBE.y, globeFrame(i), b === 'found');

    // ---- held magnifier ----
    if (b === 'peer' || b === 'found') {
      lens(ctx, a.eyes.r.x, a.eyes.r.y, k % 4 === 0);
    }

    // ---- FX ----
    if (b === 'load' && k >= 7) Iso.fx.sweat(ctx, a.head.x + 22, a.head.y + 8);
    if (b === 'tap' && (k === 0 || k === 2)) Iso.fx.ticks(ctx, a.hand.l.x - 4, a.hand.l.y - 2, 'left', C.text);
    if (b === 'pop' && k >= 1) {
      Iso.fx.sparkle(ctx, a.eyes.l.x - 3, a.eyes.l.y - 6, Iso.cycle([1, 2, 3, 2], k), C.amber);
      Iso.fx.sparkle(ctx, a.eyes.r.x + 4, a.eyes.r.y - 7, Iso.cycle([3, 2, 1, 2], k), C.text);
    }
    if (b === 'yay') {
      Iso.fx.sparkle(ctx, a.head.x - 18, a.head.y + 2, Iso.cycle([2, 3], k), C.amber);
      Iso.fx.sparkle(ctx, a.head.x + 20, a.head.y - 2, Iso.cycle([3, 2], k), C.amber);
    }
    if (b === 'spin' && k >= 1) { Iso.fx.ticks(ctx, g.x, g.y - g.r - 4, 'up', C.text); Iso.fx.ticks(ctx, g.x + 2, g.y, 'right', C.text); }
    if (b === 'found') {
      Iso.fx.bang(ctx, a.head.x, a.head.y - 8, { badge: true });
      Iso.fx.sparkle(ctx, g.x - 6, g.y - 7, Iso.cycle([1, 2, 3, 2], k), C.amber);
    }
  },
});
</script>
</body>
</html>
