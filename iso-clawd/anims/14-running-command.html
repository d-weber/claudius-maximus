<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>14 Running a Command</title>
<script src="../lib/iso.js"></script>
</head>
<body>
<script>
const { C, SPOT, SHADE } = Iso;

// ---------------------------------------------------------------- timeline (10 fps, 38 frames = 3.8 s)
// phase per frame: wind (raise arm over big button) -> slam -> run (output scrolls, eyes track,
// foot taps, progress fills) -> ding (done, happy hop) -> settle (neutral, loops).
const PHASE = [
  ['idle', 2], ['wind', 3], ['windHi', 2], ['slam', 2], ['recoil', 1],
  ['run', 20],
  ['ding', 2], ['hop', 2], ['land', 1], ['glow', 3],
];
const N = Iso.seq.len(PHASE);   // 38
const phaseStart = {};
{ let k = 0; for (const [p, n] of PHASE) { if (!(p in phaseStart)) phaseStart[p] = k; k += n; } }
const RUN0 = phaseStart.run, RUN_N = 20;

// fake output: [indent, length, colour]
const OUT = [
  [0, 15, C.green], [2, 24, C.text], [2, 19, C.muted], [2, 27, C.muted], [2, 14, C.text],
  [2, 22, C.muted], [2, 26, C.blueLight], [2, 17, C.muted], [2, 29, C.text], [2, 12, C.amber],
  [2, 20, C.muted], [2, 27, C.muted], [2, 15, C.text], [2, 24, C.blueLight], [2, 19, C.muted],
  [2, 26, C.text], [2, 10, C.muted], [2, 22, C.muted], [2, 27, C.text], [2, 17, C.muted],
  [2, 20, C.blueLight], [2, 24, C.muted], [2, 15, C.text], [2, 26, C.muted],
];
const ROWS = 9;  // visible output rows

// Floating terminal back-left, plane 'L' (faces the viewer); Clawd looks up-left at it.
function terminal(ctx, i, ph) {
  const len = 18, h = 30;
  const p = Iso.plane(ctx, 62, 62, 12, len, h, 'L', C.bg);
  const W = p.cols;
  // frame + title bar
  p.rect(0, 0, W, 3, C.surface2);
  p.rect(0, 3, 1, h - 3, C.surface2); p.rect(W - 1, 3, 1, h - 3, C.surface2); p.rect(0, h - 1, W, 1, C.surface2);
  p.px(2, 1, C.red); p.px(4, 1, C.amber); p.px(6, 1, C.green);
  const u0 = 2, v0 = 4, aw = W - 4;

  // how many lines have been printed
  let printed;
  if (ph === 'idle' || ph === 'wind' || ph === 'windHi') printed = 0;
  else if (ph === 'slam' || ph === 'recoil') printed = 1;
  else if (ph === 'run') { const k = i - RUN0; printed = 1 + Math.min(OUT.length - 1, Math.floor(k * 1.3)); }
  else printed = OUT.length;
  const done = !(ph === 'idle' || ph === 'wind' || ph === 'windHi' || ph === 'slam' || ph === 'recoil' || ph === 'run');

  // visible window: last ROWS lines (last row reserved for DONE when finished)
  const avail = done ? ROWS - 1 : ROWS;
  const first = Math.max(0, printed - avail);
  for (let r = 0; r < avail && first + r < printed; r++) {
    const [ind, L, col] = OUT[first + r];
    const v = v0 + r * 2;
    if (ind === 0) p.px(u0, v, C.orange);
    const uu = u0 + (ind === 0 ? 2 : ind);
    p.rect(uu, v, Math.min(L, aw - (uu - u0)), 1, col);
  }
  if (printed === 0) {
    // prompt with blinking cursor, waiting for enter
    p.px(u0, v0, C.orange);
    if ((i >> 1) % 2 === 0) p.rect(u0 + 2, v0 - 1, 1, 2, C.text);
  }
  if (done) {
    const v = v0 + (ROWS - 1) * 2;
    p.px(u0, v, C.orange); p.rect(u0 + 2, v, 8, 1, C.green);
  }
  // progress bar at the bottom of the window
  const bv = h - 4, bw = aw;
  p.rect(u0, bv, bw, 2, C.surface2);
  let fill = 0;
  if (ph === 'run') fill = Math.min(bw, Math.floor(((i - RUN0 + 1) / RUN_N) * bw * 0.97));
  else if (done) fill = bw;
  if (fill > 0) p.rect(u0, bv, fill, 2, done ? C.green : C.orange);
  // spinner in the title bar while running
  if (ph === 'run' || ph === 'slam' || ph === 'recoil') {
    const sp = [[0, 0], [1, 0], [1, 1], [0, 1]][i % 4];
    p.rect(W - 4 + sp[0], 0 + sp[1] + 0, 1, 1, C.orange);
  } else if (done) {
    p.rect(W - 4, 1, 2, 1, C.green);
  }
  return p;
}

const BTN = { x: 168, y: 89 };
// Big red launch button on the desk, right of Clawd (drawn before him).
function button(ctx, pressed) {
  const x = BTN.x, y = BTN.y;
  Iso.box(ctx, x, y, 0, 6, 6, 4, SHADE.dark);
  Iso.box(ctx, x, y, 4, 4, 4, pressed ? 1 : 4, SHADE.red);
  if (!pressed) { Iso.px(ctx, x - 2, y - 9, C.blush); Iso.px(ctx, x - 1, y - 9, C.blush); }   // shine
}

// ---------------------------------------------------------------- Clawd poses
function pose(i, ph) {
  const base = { x: 134, y: 77, eyes: { shape: 'open' }, arms: 'out', legs: 'stand' };
  switch (ph) {
    case 'idle':   return Object.assign(base, { eyes: { shape: 'open', gazeX: 1, gazeY: 1 } });
    case 'wind':   return Object.assign(base, { eyes: { shape: 'open', gazeX: 1, gazeY: 1 }, arms: { l: 'out', r: 'high' }, squash: -3, mouth: 'flat', shake: -1 });
    case 'windHi': return Object.assign(base, { eyes: { shape: 'wince' }, arms: { l: 'out', r: 'none' }, squash: -4, mouth: 'flat', shake: -2 });
    case 'slam':   return Object.assign(base, { eyes: { shape: 'closed' }, arms: { l: 'high', r: 'none' }, squash: 4, mouth: 'o', shake: 3 });
    case 'recoil': return Object.assign(base, { eyes: { shape: 'wide' }, arms: { l: 'out', r: 'out' }, squash: 2 });
    case 'run': {
      const k = i - RUN0;
      // eyes zip up and down following the scroll: track the newest line, then flick back up
      const gy = Iso.cycle([-2, -1, 0, 1, 0, -1], k);
      const lean = k < 3 ? -1 : -2;   // leaning toward the terminal
      const late = k >= 12;           // impatience builds
      return Object.assign(base, {
        shake: lean,
        eyes: { shape: (k === 9) ? 'blink' : (late ? 'open' : 'wide'), gazeX: -1, gazeY: gy, shine: !late },
        legs: late ? (k % 2 ? 'tap' : 'stand') : (k % 4 < 2 ? 'tap' : 'stand'),
        arms: late ? { l: 'out', r: 'down' } : { l: 'out', r: 'out' },
        mouth: late ? 'wobbly' : (k % 3 === 0 ? 'o' : 'none'),
      });
    }
    case 'ding':  return Object.assign(base, { eyes: { shape: 'wide', gazeX: -1, gazeY: -1 }, mouth: 'o', squash: 2 });
    case 'hop':   return Object.assign(base, { eyes: { shape: 'happy' }, mouth: 'laugh', arms: { l: 'up', r: 'up' }, z: 6, squash: -3, blush: true });
    case 'land':  return Object.assign(base, { eyes: { shape: 'happy' }, mouth: 'smile', arms: 'out', squash: 3, blush: true });
    case 'glow':  return Object.assign(base, { eyes: { shape: i === N - 1 ? 'open' : 'happy' }, mouth: 'smile', blush: i < N - 1 });
  }
  return base;
}

Iso.player({
  name: '14-running-command',
  fps: 10,
  frames: N,
  loop: true,
  notes: 'RUNNING A COMMAND (Bash/exec), loop, 38 frames @10 fps = 3.8 s. Clawd winds up and SLAMS a big red launch ' +
    'button; the floating terminal starts spewing output with a spinner and progress bar. He leans in, eyes zipping ' +
    'up and down chasing the scroll, foot tapping faster as impatience builds (wobbly mouth, arm drops). ' +
    'Bar hits 100%: a little bell goes DING, green check, he does a happy hop, then settles to neutral for the loop.',
  draw(ctx, i) {
    const ph = Iso.seq(PHASE, i);
    Iso.drawDesk(ctx);
        terminal(ctx, i, ph);
    const pressed = ph === 'slam' || ph === 'recoil';
    button(ctx, pressed);
    const a = Iso.drawClawd(ctx, pose(i, ph));
    Iso.prop.mug(ctx, SPOT.mug.x, SPOT.mug.y, { frame: i });

    // FX
    if (ph === 'windHi') {
      // arm cocked high over the button
      for (let k = 0; k <= 4; k++) { Iso.rect(ctx, 150 + 2 * k, 64 - 3 * k, 3, 4, C.orange); Iso.rect(ctx, 152 + 2 * k, 64 - 3 * k, 1, 4, C.orangeDark); }
      Iso.box(ctx, 163, 58, 0, 3, 3, 4, SHADE.orange);
      Iso.fx.ticks(ctx, 166, 40, 'up', C.amber);
    }
    if (ph === 'slam') {
      // the paw comes down on the cap: arm stub from the body + fist on the button
      for (let k = 0; k <= 5; k++) { Iso.rect(ctx, 153 + 2 * k, 66 + 2 * k, 4, 3, C.orange); Iso.rect(ctx, 153 + 2 * k, 69 + 2 * k, 2, 1, C.orangeDark); }
      Iso.box(ctx, BTN.x, BTN.y, 5, 3, 3, 4, SHADE.orange);
      Iso.fx.ticks(ctx, BTN.x + 12, BTN.y - 10, 'right', C.amber);
      Iso.fx.ticks(ctx, BTN.x - 2, BTN.y - 18, 'up', C.amber);
    }
    if (ph === 'run') {
      const k = i - RUN0;
      if (k >= 12 && k % 2 === 1) Iso.fx.ticks(ctx, a.feet.x + 16, a.feet.y - 2, 'up', C.text);  // tap tap
      if (k >= 14) Iso.fx.dots(ctx, a.head.x + 14, a.head.y - 6, Math.min(3, (k - 13) >> 1), C.muted);
    }
    if (ph === 'ding' || ph === 'hop' || ph === 'land') {
      // DING bubble near terminal
      const j = i - phaseStart.ding;
      const bx = 88, by = 14 - (j > 0 ? 1 : 0);
      Iso.text(ctx, bx, by, 'DING', j % 2 ? C.amber : C.text);
      Iso.fx.sparkle(ctx, bx - 6, by - 3, [3, 2, 1, 2, 1][j] || 1, C.amber);
      Iso.fx.sparkle(ctx, bx + 20, by - 2, [1, 3, 2, 1, 1][j] || 1, C.amber);
    }
    if (ph === 'hop' || ph === 'land' || ph === 'glow') {
      Iso.fx.check(ctx, a.head.x, a.head.y - 9, C.green);
    }
  },
});
</script>
</body>
</html>
