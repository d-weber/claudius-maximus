<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>08 Wink</title>
<script src="../lib/iso.js"></script>
</head>
<body>
<script>
const { C, SPOT } = Iso;

// Poses. Facing left (toward the viewer); screen-right arm is the front arm, so it does the finger gun.
const N = { eyes: { shape: 'open' }, arms: 'out' };
const POSE = {
  rest:   N,
  // casual "too cool" glance away, arm cocks back
  cool:   { eyes: { shape: 'open', gazeX: 1, gazeY: -1 }, arms: { l: 'out', r: 'high' }, squash: 1 },
  // snap to the viewer: lean in (shake toward down-left), stretch, gun drawn
  snap:   { eyes: { shape: 'wide' }, arms: { l: 'out', r: 'up' }, squash: -3, shake: -2, gun: 1 },
  // WINK + click: recoil, blush, smile
  wink:   { eyes: { shape: 'open', gazeX: -1, r: 'happy' }, arms: { l: 'out', r: 'up' }, mouth: 'smile', blush: true, squash: 2, shake: -2, gun: 2 },
  hold:   { eyes: { shape: 'open', gazeX: -1, r: 'happy' }, arms: { l: 'out', r: 'up' }, mouth: 'smile', blush: true, shake: -1, gun: 1 },
  holdB:  { eyes: { shape: 'open', gazeX: -1, r: 'happy' }, arms: { l: 'out', r: 'up' }, mouth: 'smile', blush: true, shake: -1, gun: 1, blow: true },
  // settle back
  settle: { eyes: { shape: 'blink' }, arms: 'out', blush: true, squash: 1 },
};
// [pose, hold]; total 11 frames @ 10 fps = 1.1 s
const TL = [['rest', 1], ['cool', 2], ['snap', 1], ['wink', 1], ['hold', 2], ['holdB', 2], ['settle', 1], ['rest', 1]];
// sparkle "ting" timeline, frame index -> size (0 = none)
const TING = [0, 0, 0, 0, 1, 3, 2, 1, 0, 0, 0];

// finger gun off the raised screen-right hand: thumb up, index finger pointing out to the right
// L = lit, M = mid, D = shade
const GUN = [
  '.LL.........',
  '.LM.........',
  '.LM.........',
  'LLMLLLLLLLL.',
  'MMMMMMMMMMMD',
  'MMMMD.......',
  'DDDD........',
];
const GUN_RECOIL = [ // "click": thumb hammer drops, barrel kicks up
  '..........L.',
  '.LL......LMD',
  'LLMLLLLLLMD.',
  'MMMMMMMMMD..',
  'MMMMD.......',
  'DDDD........',
  '............',
];
function finger(ctx, h, kind) {
  Iso.sprite(ctx, h.x - 2, h.y - 4, kind === 2 ? GUN_RECOIL : GUN,
    { L: C.orangeLight, M: C.orange, D: C.orangeDark });
}

Iso.player({
  name: '08-wink',
  fps: 10,
  frames: Iso.seq.len(TL),
  loop: false,
  notes: 'One-shot, 11 frames @ 10 fps (1.1 s), ends neutral. Alternate tap reaction. Clawd glances away all casual, ' +
    'cocks his arm, then snaps to the viewer with a lean-in and fires a finger gun: <b>click</b> (tiny recoil + muzzle spark), ' +
    'wink, smile, blush, and a <b>"ting!"</b> star glint off his open eye. He blows the imaginary smoke off the finger, blinks and settles.',
  draw(ctx, i) {
    Iso.drawDesk(ctx);
    Iso.prop.mug(ctx, SPOT.left.x - 8, SPOT.left.y - 6, { frame: i });

    const name = Iso.seq(TL, i);
    const p = POSE[name];
    const a = Iso.drawClawd(ctx, Object.assign({ x: SPOT.clawd.x, y: SPOT.clawd.y }, p));

    // finger gun on the front (screen-right) hand
    if (p.gun && a.hand.r) {
      finger(ctx, a.hand.r, p.gun);
      if (name === 'wink') {               // "click": muzzle spark at the fingertip
        Iso.fx.sparkle(ctx, a.hand.r.x + 14, a.hand.r.y - 4, 2, C.amber);
      }
      if (p.blow) {                         // a wisp of "smoke" off the fingertip
        const k = i % 2;
        Iso.px(ctx, a.hand.r.x + 11, a.hand.r.y - 3 - k, C.muted);
        Iso.px(ctx, a.hand.r.x + 12, a.hand.r.y - 5 - k, C.dim);
        Iso.px(ctx, a.hand.r.x + 11, a.hand.r.y - 7 - k, C.dim);
      }
    }

    // "ting!" glint off the open (screen-left) eye
    const s = TING[i] || 0;
    if (s) Iso.fx.sparkle(ctx, a.eyes.l.x - 5, a.eyes.l.y - 7, s, C.text);
    if (s === 3) Iso.text(ctx, a.eyes.l.x - 26, a.eyes.l.y - 18, 'TING', C.amber);
  },
});
</script>
</body>
</html>
