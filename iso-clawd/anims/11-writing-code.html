<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Writing Code</title>
<script src="../lib/iso.js"></script>
</head>
<body>
<script>
const { C, SHADE: SH } = Iso;

// Layout: laptop beside Clawd (screen faces down-right so we can read it), Clawd facing left,
// eyes glued to the screen, screen-left hand over the keyboard. Mug on his right.
const CL = { x: 138, y: 74 };     // Clawd feet
const LAP = { x: 100, y: 70 };    // laptop footprint centre
const MUG = Iso.SPOT.mug;         // mug on its spot (drawn after Clawd)

// ---- timeline: one descriptor per frame (built once, deterministic) ----
// kind: type | hover | wind1 | wind2 | slam | recoil | proud | reach | sip | putback
// rate: px of code typed this frame
const PLAN = [
  ['type', 12, 2], ['hover', 2, 0], ['wind1', 1, 0], ['wind2', 2, 0], ['slam', 1, 'NL'],
  ['recoil', 1, 0], ['proud', 2, 0], ['type', 4, 2], ['reach', 1, 1], ['sip', 7, 0.5],
  ['putback', 1, 1], ['type', 5, 2],
];
const FR = [];
for (const [kind, n, rate] of PLAN) for (let k = 0; k < n; k++) FR.push({ kind, k, rate });

// Code lines (period of 4 per loop): [indent, length, colour]
const LINES = [[0, 10, C.violet], [2, 14, C.text], [2, 12, C.amber], [4, 11, C.blueLight]];

// Screen state per frame: {line: absolute line index, col: px typed on it}
const SCR = [];
(function () {
  let line = 0, col = 0, acc = 0;
  for (const f of FR) {
    if (f.rate === 'NL') { line++; col = 0; }
    else {
      acc += f.rate;
      while (acc >= 1) {
        acc -= 1;
        if (col >= LINES[line % 4][1]) { line++; col = 0; }
        col++;
      }
    }
    SCR.push({ line, col, slam: f.rate === 'NL' });
  }
})();
// 4 lines are written per loop, so the code on screen at the loop seam matches frame 0.

function drawCode(p, A, i) {
  const s = SCR[i];
  const rows = 5;                                   // visible rows (v = 1,3,5,7,9)
  for (let r = 0; r < rows; r++) {
    const ln = s.line - (rows - 1 - r);             // current line on the bottom row
    const L = LINES[((ln % 4) + 4) % 4];
    const n = ln === s.line ? s.col : L[1];
    const v = A.v + 1 + r * 2;
    if (n > 0) p.rect(A.u + 1 + L[0], v, n, 1, L[2]);
    if (ln === s.line) {
      const typing = FR[i].kind === 'type' || FR[i].kind === 'sip' || FR[i].kind === 'reach';
      if (typing || (i >> 1) % 2 === 0) p.rect(A.u + 2 + L[0] + n, v - 1, 1, 2, C.text);
    }
  }
}

// Bigger laptop than the stock prop (same look), screen facing down-right.
function laptop(ctx, x, y, z, i, flash) {
  const A = 12, B = 8, o = Iso.obj(ctx, x, y, A, B, 'right', z);
  o.box(0, 0, 0, A, B, 2, SH.metal, 'base');
  o.box(0, 0, 2, A, 1, 14, { top: C.muted, left: C.grey, right: C.greyDark }, 'lid');
  const r = o.draw();
  for (let a = 1; a < A - 1; a++) for (let b = 2; b < B - 1; b++) if ((a + b) % 2 === 0) {
    const p = o.pt(a + 0.5, b + 0.5, 2);
    Iso.rect(ctx, p.x - 1, p.y, 2, 1, C.greyDark);
  }
  const s = r.lid.front, area = { u: 2, v: 1, w: s.cols - 4, h: 11 };
  s.rect(area.u, area.v, area.w, area.h, flash ? C.glow : C.screen);
  if (!flash) drawCode(s, area, i);
  return { s, area, o };
}

// 2D mug sprite for when it's in his hand (matches prop.mug colours). (x, y) = centre.
function heldMug(ctx, x, y, i, steam) {
  Iso.sprite(ctx, x - 4, y - 5, [
    '.tttttt..',
    'tcccccct.',
    'llllrrrhh',
    'llllrrr.h',
    'llllrrr.h',
    'llllrrrhh',
    'llllrrr..',
    '.lllrr...',
  ], { t: C.paper, c: C.woodRight, l: SH.paper.left, r: SH.paper.right, h: SH.paper.right });
  if (steam) {
    const f = i % 4, wig = [0, 1, 0, -1];
    for (let k = 0; k < 3; k++) {
      Iso.px(ctx, x - 2 + wig[(f + k) % 4], y - 7 - k * 2, k ? C.dim : C.muted);
      Iso.px(ctx, x + 1 + wig[(f + k + 2) % 4], y - 8 - k * 2, k ? C.dim : C.muted);
    }
  }
}

// Keyboard clacks: tiny specks flying up/out from the typing hand
function clacks(ctx, hx, hy, i) {
  const spots = [[-3, -2], [1, -3], [-2, -3], [2, -2], [-4, -1], [0, -4]];
  for (let age = 0; age < 3; age++) {
    const j = i - age;
    const [dx, dy] = spots[((j % 6) + 6) % 6];
    const m = age + 1;
    const x = hx - 2 + dx * m, y = hy - 3 + dy * m;
    if (age === 0) Iso.rect(ctx, x, y, 2, 1, C.text);
    else if (age === 1) Iso.rect(ctx, x, y, 1, 1, C.text);
    else Iso.px(ctx, x, y, C.muted);
  }
}

function tongue(fp, k) {
  // flat concentrated mouth with the tongue poking out of the screen-left corner, wiggling
  fp.rect(12, 18, 7, 1, C.eye);
  const u = 12 + (k % 2);
  fp.rect(u, 19, 3, 2, C.red);
  fp.px(u + 1, 19, C.blush);
  fp.rect(u + (k % 2 ? 0 : 1), 21, 2, 1, C.red);
}

const TYPE_EYES = { shape: 'open', gazeX: -1, gazeY: 1 };

Iso.player({
  name: '11-writing-code',
  fps: 10,
  frames: FR.length,   // 39
  loop: true,
  notes: 'Edit/Write. Clawd hammers the keyboard with alternating typeA/typeB arms, eyes glued to the screen and ' +
    'tongue poking out in concentration; code lines grow and scroll on the laptop, keyboard clacks fly off. ' +
    'Gag 1: he winds up and SLAMS enter (stretch, squash, screen flash, laptop hop, sparkle, green check). ' +
    'Gag 2: he grabs the mug and sips without ever looking away from the screen, still pecking with one hand. ' +
    'Loop, 39 frames @ 10 fps = 3.9 s.',
  draw(ctx, i) {
    const f = FR[i], kind = f.kind;
    Iso.drawDesk(ctx);

    // ---- laptop (behind Clawd) ----
    const lapZ = kind === 'recoil' ? 1 : 0;
    laptop(ctx, LAP.x, LAP.y, lapZ, i, kind === 'slam');

    // ---- Clawd pose ----
    const alt = i % 2 === 0;
    let o = { x: CL.x, y: CL.y, eyes: TYPE_EYES, arms: { l: alt ? 'typeA' : 'typeB', r: alt ? 'typeB' : 'typeA' } };
    let tongueOn = false, mugHeld = false;
    switch (kind) {
      case 'type':
        tongueOn = true;
        if (i === 7) o.eyes = { shape: 'blink', gazeX: -1, gazeY: 1 };
        o.squash = i % 2;                // bouncing along with the keystrokes
        if (i % 4 === 1) o.shake = -1;   // a little jitter from the frenzy
        break;
      case 'hover':
        o.arms = { l: 'typeB', r: 'typeB' };
        o.eyes = { shape: 'open', gazeX: -1, gazeY: 0 };
        o.mouth = 'flat';
        break;
      case 'wind1':
        o.arms = { l: 'high', r: 'typeB' };
        o.eyes = { shape: 'open', gazeX: -1, gazeY: -1 };
        o.squash = -2; o.mouth = 'o';
        break;
      case 'wind2':
        o.arms = { l: 'up', r: 'out' };
        o.eyes = { shape: 'wide', gazeX: -1, gazeY: -1 };
        o.squash = -4; o.mouth = 'o';
        break;
      case 'slam':
        o.arms = { l: 'typeA', r: 'out' };
        o.eyes = { shape: 'wince' };
        o.squash = 5; o.mouth = 'flat';
        break;
      case 'recoil':
        o.arms = { l: 'typeB', r: 'out' };
        o.eyes = { shape: 'happy' };
        o.squash = 2; o.mouth = 'laugh';
        break;
      case 'proud':
        o.arms = { l: 'typeB', r: 'typeB' };
        o.eyes = { shape: 'happy' };
        o.mouth = 'smile'; o.blush = true;
        break;
      case 'reach':
        o.arms = { l: alt ? 'typeA' : 'typeB', r: 'forward' };
        break;
      case 'sip':
        o.arms = { l: (i >> 1) % 2 ? 'typeA' : 'typeB', r: 'forward' };
        mugHeld = true;
        if (f.k === 4) o.blush = true;   // mmm
        break;
      case 'putback':
        o.arms = { l: alt ? 'typeA' : 'typeB', r: 'forward' };
        break;
    }
    const a = Iso.drawClawd(ctx, o);
    if (tongueOn) tongue(a.facePainter, i >> 1);

    // ---- mug ----
    if (mugHeld) {
      // held at the mouth, steam curling up past his (unmoving) eyes
      heldMug(ctx, a.mouth.x + 1, a.mouth.y + 1, i, true);
    } else if (kind === 'reach' || kind === 'putback') {
      heldMug(ctx, a.hand.r.x + 3, a.hand.r.y + 2, i, false);
    } else {
      Iso.prop.mug(ctx, MUG.x, MUG.y, { frame: i });
    }

    // ---- FX ----
    const hl = a.hand.l;
    if (kind === 'type' || kind === 'reach' || kind === 'putback' || (kind === 'sip' && i % 2 === 0)) clacks(ctx, hl.x, hl.y, i);
    if (kind === 'slam') {
      Iso.fx.sparkle(ctx, hl.x - 2, hl.y - 4, 3, C.amber);
      Iso.fx.ticks(ctx, hl.x - 2, hl.y - 2, 'left', C.text);
      Iso.fx.ticks(ctx, a.head.x, a.head.y - 3, 'up', C.amber);
    }
    if (kind === 'recoil') {
      Iso.fx.sparkle(ctx, hl.x - 6, hl.y - 8, 2, C.amber);
      Iso.fx.sparkle(ctx, 78, 42, 1, C.text);
    }
    if (kind === 'recoil' || kind === 'proud') Iso.fx.check(ctx, 92, 38 - (kind === 'proud' ? 1 : 0), C.green);
    if (kind === 'proud') Iso.fx.sparkle(ctx, hl.x - 8, hl.y - 10, 1, C.amber);
  },
});
</script>
</body>
</html>
