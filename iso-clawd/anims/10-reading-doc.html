<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Reading A Doc</title>
<script src="../lib/iso.js"></script>
</head>
<body>
<script>
const { C, SPOT } = Iso;

// ---------------------------------------------------------------- scene layout
const CL = { x: 128, y: 72 };        // Clawd feet (sitting, nudged back-right to make room)
const BK = { x: 102, y: 85 };         // open book, front-left of Clawd (he faces down-left onto it)
const LAMP = { x: 70, y: 74 };       // reading lamp, back-left
const MUG = { x: 170, y: 82 };       // cocoa, right of Clawd

// ---------------------------------------------------------------- helpers (page-local)
// Integer scanline fill of a convex polygon [{x,y}...].
function fillPoly(ctx, pts, color) {
  const P = pts.map((p) => ({ x: Math.round(p.x), y: Math.round(p.y) }));
  let y0 = Infinity, y1 = -Infinity;
  for (const p of P) { y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
  for (let y = y0; y <= y1; y++) {
    let lo = Infinity, hi = -Infinity;
    for (let k = 0; k < P.length; k++) {
      const a = P[k], b = P[(k + 1) % P.length];
      if ((y < Math.min(a.y, b.y)) || (y > Math.max(a.y, b.y))) continue;
      if (a.y === b.y) { lo = Math.min(lo, a.x, b.x); hi = Math.max(hi, a.x, b.x); continue; }
      const x = a.x + ((y - a.y) * (b.x - a.x)) / (b.y - a.y);
      lo = Math.min(lo, Math.round(x)); hi = Math.max(hi, Math.round(x));
    }
    if (hi >= lo) Iso.rect(ctx, lo, y, hi - lo + 1, 1, color);
  }
}

// Page "words": [page 0|1][line] -> list of [i0, n] word runs (cells), on the book's top grid.
// Left page spans i 1..4, right page i 6..9; lines on j 1, 3, 5.
const WORDS = [
  [[[1, 2], [4, 1]], [[1, 1], [3, 2]], [[1, 3]]],
  [[[6, 1], [8, 2]], [[6, 3]], null],    // right page line 3 = fine print (dithered)
];

// Open book with reading marker + optional flipping page.
// st.mark = {p, l, k} highlights word k of line l on page p. st.flip = 0 none, 1..4 page angle.
function drawBook(ctx, st, i) {
  // hard cover (a bit larger than the pages), then the page block on top
  const cv = Iso.box(ctx, BK.x, BK.y, 0, 12, 9, 1, Iso.SHADE.red);
  const r = Iso.box(ctx, BK.x, BK.y, 1, 10, 7, 3, { top: C.paper, left: C.paperShade, right: C.muted });
  // bookmark ribbon hanging out of the gutter
  const rb = r.left.at(10, 2); Iso.rect(ctx, rb.x, rb.y, 1, 4, C.amber); Iso.px(ctx, rb.x + 1, rb.y + 4, C.amber);
  // page edges stack on the side faces
  r.left.rect(0, 1, r.left.cols, 1, C.paper);
  r.right.rect(0, 1, r.right.cols, 1, C.paper);
  for (let j = 0; j < 7; j++) r.top.cell(5, j, C.paperShade);   // gutter
  // words
  WORDS.forEach((page, p) => page.forEach((line, l) => {
    const j = 1 + l * 2;
    if (!line) { // fine print: tiny broken dots
      for (let c = 6; c < 9; c++) { const q = r.top.at(c, j); Iso.px(ctx, q.x, q.y + 1, C.muted); Iso.px(ctx, q.x + 1, q.y + 2, C.paperShade); }
      if (st.mark && st.mark.p === 1 && st.mark.l === 2) {
        const q = r.top.at(6 + st.mark.k, j); Iso.px(ctx, q.x, q.y + 1, C.orange); Iso.px(ctx, q.x + 1, q.y + 2, C.orange);
      }
      return;
    }
    line.forEach(([i0, n], k) => {
      const on = st.mark && st.mark.p === p && st.mark.l === l && st.mark.k === k;
      for (let c = i0; c < i0 + n; c++) r.top.cell(c, j, on ? C.orange : C.ink);
    });
  }));
  // flipping page: hinged on the gutter (world x = 5.5), sweeps right page -> left page
  if (st.flip) {
    const ang = [0, 35, 80, 125, 165][st.flip] * Math.PI / 180;
    const W = 4.4, tx = 5.5 + W * Math.cos(ang), tz = Math.round(W * 2.2 * Math.sin(ang));
    const pt = (wx, wy, wz) => { const q = r.top.at(wx, wy); return { x: q.x, y: q.y - wz }; };
    const curl = st.flip === 2 || st.flip === 3 ? 1 : 0;   // a little flutter at the top
    const quad = [pt(5.5, 0.5, 0), pt(tx, 0.5, tz + curl), pt(tx, 6.5, tz), pt(5.5, 6.5, 0)];
    fillPoly(ctx, quad, st.flip >= 3 ? C.paperShade : C.paper);
    // outline the free edge so it reads against the pages behind
    Iso.line(ctx, Math.round(quad[1].x), Math.round(quad[1].y), Math.round(quad[2].x), Math.round(quad[2].y), C.muted);
    if (st.flip <= 2) { // ghost lines of text on the lifting page's face
      const a = pt(5.5 + (tx - 5.5) * 0.4, 2, tz * 0.4), b = pt(5.5 + (tx - 5.5) * 0.4, 4, tz * 0.4);
      Iso.rect(ctx, Math.round(a.x), Math.round(a.y), 2, 1, C.paperShade);
      Iso.rect(ctx, Math.round(b.x), Math.round(b.y), 2, 1, C.paperShade);
    }
  }
  return r;
}

// Half-moon reading glasses painted on the face (sit low, for looking down at the page).
function drawGlasses(F, low) {
  const v = 10 + (low ? 2 : 0), rim = C.text, bar = C.greyLight;
  for (const u0 of [2, 20]) {
    F.rect(u0, v, 10, 1, rim);            // top rim
    F.rect(u0, v + 1, 1, 6, rim);         // sides
    F.rect(u0 + 9, v + 1, 1, 6, rim);
    F.rect(u0 + 1, v + 7, 8, 1, rim);     // bottom (half-moon: rounded corners)
  }
  F.rect(12, v + 1, 8, 1, bar);           // bridge
  F.rect(0, v + 1, 2, 1, bar);            // temple arms
  F.rect(30, v + 1, 2, 1, bar);
}
const GLASSES_HAND = ['###.###', '#.###.#', '###.###'];

// ---------------------------------------------------------------- timeline
// g: [gazeX, gazeY]; mark: reading marker; gl: 0 none, 1 in hand, 2 on face (low), 3 on face pushed up
const F_ = (o) => Object.assign({ g: [0, 2], eyes: 'open', arms: 'forward', squash: 0, gl: 0, flip: 0, mouth: 'none' }, o);
const P = {
  // line 1 (left page)
  a0: F_({ g: [-1, 1], mark: { p: 0, l: 0, k: 0 } }),
  a1: F_({ g: [0, 1],  mark: { p: 0, l: 0, k: 1 } }),
  // drop a line (little head bob)
  b0: F_({ g: [-1, 2], mark: { p: 0, l: 1, k: 0 }, squash: 1 }),
  b1: F_({ g: [0, 2],  mark: { p: 0, l: 1, k: 1 } }),
  blink: F_({ g: [0, 2], eyes: 'blink', mark: { p: 0, l: 1, k: 1 } }),
  // over to right page
  c0: F_({ g: [1, 1],  mark: { p: 1, l: 0, k: 0 } }),
  c1: F_({ g: [1, 1],  mark: { p: 1, l: 0, k: 1 } }),
  c2: F_({ g: [1, 2],  mark: { p: 1, l: 1, k: 0 }, squash: 1 }),
  // fine print! squint, lean in
  sq0: F_({ g: [1, 2], eyes: 'blink', squash: 2, mark: { p: 1, l: 2, k: 0 } }),
  sq1: F_({ g: [1, 2], eyes: 'wince', squash: 2, mark: { p: 1, l: 2, k: 0 }, sweat: true }),
  // fetch reading glasses
  fetch: F_({ g: [1, -1], eyes: 'open', arms: { l: 'forward', r: 'up' }, gl: 1, spark: true }),
  puton: F_({ g: [0, 0], eyes: 'happy', arms: { l: 'forward', r: 'up' }, gl: 2, squash: -1 }),
  // ah, now I can see
  see0: F_({ g: [1, 2], eyes: 'wide', gl: 2, mark: { p: 1, l: 2, k: 0 } }),
  see1: F_({ g: [1, 2], eyes: 'wide', gl: 2, mark: { p: 1, l: 2, k: 1 } }),
  see2: F_({ g: [1, 2], eyes: 'wide', gl: 2, mark: { p: 1, l: 2, k: 2 } }),
  // "hmm, interesting" nod
  n0: F_({ g: [0, 2], eyes: 'open', gl: 2, squash: 2, mouth: 'flat', hmm: 1 }),
  n1: F_({ g: [0, 0], eyes: 'open', gl: 2, squash: 0, mouth: 'flat', hmm: 2 }),
  n2: F_({ g: [0, 2], eyes: 'closed', gl: 2, squash: 2, mouth: 'flat', hmm: 2 }),
  n3: F_({ g: [0, 0], eyes: 'happy', gl: 2, squash: 0, mouth: 'smile', hmm: 2 }),
  // lick a finger...
  lick: F_({ g: [0, -1], eyes: 'closed', lickFinger: true, arms: { l: 'forward', r: 'none' }, gl: 2, mouth: 'laugh', squash: -1 }),
  // ...and flip the page
  f1: F_({ g: [1, 2], gl: 2, flip: 1, arms: { l: 'forward', r: 'forward' } }),
  f2: F_({ g: [0, 1], gl: 2, flip: 2, flutter: true }),
  f3: F_({ g: [-1, 1], gl: 2, flip: 3, flutter: true }),
  f4: F_({ g: [-1, 2], gl: 2, flip: 4, squash: 1 }),
  // glasses off (fold them away), settle back into reading
  off: F_({ g: [0, 0], eyes: 'blink', arms: { l: 'forward', r: 'up' }, gl: 1, squash: -1 }),
  settle: F_({ g: [-1, 1], eyes: 'open', squash: 1 }),
};
const TL = [
  ['a0', 3], ['a1', 2],
  ['b0', 2], ['b1', 2], ['blink', 1], ['b1', 1],
  ['c0', 2], ['c1', 1], ['c2', 1],
  ['sq0', 1], ['sq1', 2],
  ['fetch', 2], ['puton', 1],
  ['see0', 2], ['see1', 1], ['see2', 1],
  ['n0', 1], ['n1', 1], ['n2', 1], ['n3', 2],
  ['lick', 2],
  ['f1', 1], ['f2', 1], ['f3', 1], ['f4', 1],
  ['off', 2], ['settle', 1],
];

Iso.player({
  name: '10-reading-doc',
  fps: 10,
  frames: Iso.seq.len(TL),
  loop: true,
  notes: 'READING A DOC (Read/Grep/Glob), 39-frame loop, 3.9 s at 10 fps. Clawd sits at his desk by a warm lamp, ' +
    'nose in an open book: his eyes track each line left to right while an orange highlight follows the word he is on, ' +
    'then drop a line. <b>Gag:</b> he hits the fine print, squints and sweats, pulls a pair of half-moon reading glasses ' +
    'out of nowhere, goes wide-eyed, nods "HMM." with a smile, licks a finger and flips the page. Then the glasses go back in the pocket and he starts the new page.',
  draw(ctx, i) {
    const s = P[Iso.seq(TL, i)];
    Iso.drawDesk(ctx);
    Iso.prop.lamp(ctx, LAMP.x, LAMP.y, { facing: 'right', on: true });
    Iso.prop.mug(ctx, MUG.x, MUG.y, { frame: i >> 1, color: 'blue' });

    const a = Iso.drawClawd(ctx, {
      x: CL.x, y: CL.y, legs: 'sit', arms: s.arms, squash: s.squash, mouth: s.mouth,
      eyes: { shape: s.eyes, gazeX: s.g[0], gazeY: s.g[1] },
      blush: s.eyes === 'happy',
    });
    if (s.gl >= 2) drawGlasses(a.facePainter, true);
    if (s.lickFinger) { // a stubby finger raised to the tongue
      const Fp = a.facePainter;
      Fp.rect(18, 19, 4, 7, C.orangeLight); Fp.rect(22, 19, 1, 7, C.orangeDark); Fp.rect(18, 26, 5, 1, C.orangeDark);
    }
    if (s.gl === 1 && a.hand.r) Iso.sprite(ctx, a.hand.r.x - 3, a.hand.r.y - 5, GLASSES_HAND, { '#': C.text });

    drawBook(ctx, s, i);

    // FX
    if (s.spark && a.hand.r) Iso.fx.sparkle(ctx, a.hand.r.x + 6, a.hand.r.y - 8, 1 + (i & 1), C.amber);
    if (s.sweat) Iso.fx.sweat(ctx, a.head.x + 14, a.head.y + 6);
    if (s.hmm) {
      const box = Iso.fx.puff(ctx, a.head.x + 6, a.head.y - 16, 25, 11, { kind: 'thought', tail: 'left' });
      Iso.text(ctx, box.x + 1, box.y + 1, s.hmm === 1 ? 'HM' : 'HMM.', C.text);
    }
    if (s.flutter) {
      const q = { x: BK.x + 6, y: BK.y - 14 };
      Iso.fx.ticks(ctx, q.x, q.y, 'up', C.muted);
    }
  },
});
</script>
</body>
</html>
