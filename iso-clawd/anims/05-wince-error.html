<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Error Wince</title>
<script src="../lib/iso.js"></script>
</head>
<body>
<script>
const { C, SPOT } = Iso;

// Laptop sits on the left of the desk with its screen toward the viewer, Clawd types on it.
const LAP = { x: SPOT.left.x + 2, y: SPOT.left.y + 2 };

// One entry per frame (10 fps). dx = Clawd x offset (he hops back to the right), z = lift.
// scr: 'code' | 'red' | 'dead' | 'boot'. poof: smoke frame 0..3 or -1. cross: y offset of the red x or null.
const F = [
  // 0-1 typing away, all fine
  { eyes: { shape: 'open', gazeX: -1, gazeY: 1 }, arms: { l: 'typeA', r: 'typeB' }, scr: 'code' },
  { eyes: { shape: 'open', gazeX: -1, gazeY: 1 }, arms: { l: 'typeB', r: 'typeA' }, scr: 'code' },
  // 2 ERROR: screen goes red, eyes pop wide (anticipation squash)
  { eyes: { shape: 'wide', gazeX: -1 }, mouth: 'o', arms: { l: 'out', r: 'out' }, squash: 2, scr: 'red', spark: 1 },
  // 3-4 jump back "> <", laptop puffs smoke, a big red x falls from the sky
  { eyes: 'wince', mouth: 'wobbly', arms: { l: 'up', r: 'up' }, dx: 4, z: 4, squash: -3, legs: 'stepA', scr: 'red', poof: 0, spark: 3, cross: -24 },
  { eyes: 'wince', mouth: 'wobbly', arms: { l: 'high', r: 'high' }, dx: 7, z: 5, squash: -2, legs: 'stepB', scr: 'dead', poof: 1, cross: -18 },
  // 5 land + BONK
  { eyes: 'wince', mouth: 'wobbly', arms: { l: 'down', r: 'down' }, dx: 8, squash: 5, scr: 'dead', poof: 2, cross: 3, bonk: true },
  // 6-7 dizzy shake, x bounces off and hovers
  { eyes: 'wince', mouth: 'wobbly', arms: { l: 'down', r: 'down' }, dx: 8, shake: 2, squash: 2, scr: 'dead', poof: 3, cross: -13, sweat: 0 },
  { eyes: 'wince', mouth: 'wobbly', arms: { l: 'down', r: 'down' }, dx: 8, shake: -2, scr: 'dead', cross: -11, sweat: 0 },
  // 8-9 peek at the laptop, sheepish; the x pops away
  { eyes: { shape: 'open', gazeX: -1, gazeY: 1 }, mouth: 'wobbly', arms: { l: 'down', r: 'down' }, dx: 8, scr: 'dead', sweat: 1, blush: true, crossPop: true },
  { eyes: { shape: 'open', gazeX: -1, gazeY: 1 }, mouth: 'wobbly', arms: { l: 'down', r: 'down' }, dx: 8, scr: 'boot', sweat: 2, blush: true },
  // 10-11 shrug: "oops, heh"
  { eyes: 'happy', mouth: 'wobbly', arms: { l: 'high', r: 'high' }, dx: 8, squash: -1, scr: 'boot', sweat: 3, blush: true },
  { eyes: 'happy', mouth: 'smile', arms: { l: 'high', r: 'high' }, dx: 8, scr: 'code', blush: true },
  // 12-13 shuffle back to the spot
  { eyes: 'open', arms: 'out', dx: 4, legs: 'stepA', scr: 'code' },
  { eyes: 'open', arms: 'out', dx: 0, legs: 'stand', squash: 1, scr: 'code' },
  // 14 neutral
  { eyes: 'open', arms: 'out', scr: 'code' },
];

// Big red "x" with a dark outline so it still reads on top of Clawd's orange head.
const XROWS = ['rr...rr', 'rrr.rrr', '.rrrrr.', '..rrr..', '.rrrrr.', 'rrr.rrr', 'rr...rr'];
function bigCross(ctx, cx, cy) {
  const x0 = cx - 3, y0 = cy - 3, on = (r, c) => r >= 0 && r < 7 && c >= 0 && c < 7 && XROWS[r][c] === 'r';
  for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) {
    if (on(r, c)) continue;
    if (on(r - 1, c) || on(r + 1, c) || on(r, c - 1) || on(r, c + 1)) Iso.px(ctx, x0 + c, y0 + r, C.redDark);
  }
  Iso.sprite(ctx, x0, y0, XROWS, { r: C.red });
  Iso.px(ctx, x0, y0, C.orangeLight); Iso.px(ctx, x0 + 5, y0, C.orangeLight); // tiny shine
}

// Screen fillers drawn through the laptop's face painter.
function redScreen(p, A) {
  p.rect(A.u, A.v, A.w, A.h, C.red);
  // chunky white x in the middle
  const cu = A.u + (A.w >> 1) - 3, cv = A.v + 1;
  const X = ['##....##', '.##..##.', '..####..', '..####..', '.##..##.', '##....##'];
  X.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '#') p.px(cu + c, cv + r, C.text); }));
}
function deadScreen(p, A) {
  p.rect(A.u, A.v, A.w, A.h, C.surface);
  p.rect(A.u + (A.w >> 1) - 1, A.v + (A.h >> 1), 2, 1, C.redDark); // dying ember dot
}
function bootScreen(p, A) {
  p.rect(A.u, A.v, A.w, A.h, C.screen);
  p.rect(A.u + 1, A.v + 1, 2, 1, C.green);
  p.rect(A.u + 4, A.v + 1, 4, 1, C.muted);
}

Iso.player({
  name: '05-wince-error',
  fps: 10,
  frames: F.length,   // 15 frames = 1.5 s
  loop: false,
  notes: 'One-shot, 15 frames @ 10 fps (1.5 s). Clawd is typing when the laptop screen flashes red with a big x and ' +
    'sparks; he yelps "o" and hops back with a "&gt; &lt;" wince while the laptop puffs smoke. Gag: a big red x falls ' +
    'from the sky and BONKs him on landing (squash + impact ticks), bounces off and pops. Two-frame dizzy shake, arms drop, a sweat drop slides down, he peeks at the ' +
    '(rebooting) laptop with a wobbly mouth and blush, gives a sheepish ^ ^ shrug, and shuffles back to neutral.',
  draw(ctx, i) {
    const f = F[i];
    Iso.drawDesk(ctx);

    // laptop (behind / beside Clawd)
    const scrFn = f.scr === 'red' ? redScreen : f.scr === 'dead' ? deadScreen : f.scr === 'boot' ? bootScreen : 'code';
    const lap = Iso.prop.laptop(ctx, LAP.x, LAP.y, { facing: 'right', screen: scrFn, frame: i < 2 ? i : i + 3 });
    // lid-top point for smoke / sparks
    const lidTop = lap.screen.at(lap.area.u + (lap.area.w >> 1), -1);

    // Clawd
    const a = Iso.drawClawd(ctx, {
      x: SPOT.clawd.x + (f.dx || 0), y: SPOT.clawd.y + ((f.dx || 0) >> 1), z: f.z || 0,
      eyes: f.eyes, mouth: f.mouth || 'none', arms: f.arms, legs: f.legs || 'stand',
      squash: f.squash || 0, shake: f.shake || 0, blush: !!f.blush,
    });
    Iso.prop.mug(ctx, SPOT.mug.x, SPOT.mug.y, { frame: i });   // the mug spot is in front of him

    // FX
    if (f.spark) {
      Iso.fx.sparkle(ctx, lidTop.x - 9, lidTop.y + 2, f.spark, C.amber);
      Iso.fx.sparkle(ctx, lidTop.x + 10, lidTop.y - 1, f.spark === 3 ? 2 : 1, C.amber);
    }
    if (f.poof !== undefined) {
      // two puffs rising and drifting apart, dark grey once they thin out
      const c = f.poof < 2 ? C.muted : C.dim;
      Iso.fx.poof(ctx, lidTop.x - 2, lidTop.y - 5 - f.poof * 3, Math.min(3, f.poof + 1), c);
      Iso.fx.poof(ctx, lidTop.x + 7 + f.poof, lidTop.y - 10 - f.poof * 3, f.poof, c);
    }
    const hx = a.head.x + 4;
    if (f.cross !== undefined) bigCross(ctx, hx, a.head.y + f.cross);
    if (f.bonk) {
      Iso.fx.ticks(ctx, hx - 9, a.head.y - 4, 'left', C.text);
      Iso.fx.ticks(ctx, hx + 9, a.head.y - 4, 'right', C.text);
    }
    if (f.crossPop) {
      Iso.fx.poof(ctx, hx, a.head.y - 12, 3, C.red);
    }
    if (f.sweat !== undefined) {
      // on the face side (screen-left upper corner of the face)
      Iso.fx.sweat(ctx, a.face.x - 20, a.face.y - 11 + f.sweat * 2);
    }
  },
});
</script>
</body>
</html>
