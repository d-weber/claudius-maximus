<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hop Todo</title>
<script src="../lib/iso.js"></script>
</head>
<body>
<script>
const { C, SPOT } = Iso;

// Todo clipboard propped upright beside Clawd on the screen-left (drawn before him), facing the viewer.
const CB = { x: SPOT.left.x + 4, y: SPOT.left.y + 8 };
const ROWS = [5, 10, 15];   // v of each todo row on the board
// Upright clipboard on a little wooden foot. Returns the face painter.
function todoBoard(ctx, x, y, z, done) {
  Iso.box(ctx, x + 1, y, z, 9, 2, 2, Iso.SHADE.wood);                    // foot
  const p = Iso.plane(ctx, x, y - 1, z + 2, 8, 22, 'L', C.woodLeft);     // board
  p.rect(0, 0, p.cols, 1, C.woodTop);
  p.rect(1, 2, p.cols - 2, 19, C.paper);                                  // sheet
  p.rect(1, 20, p.cols - 2, 1, C.paperShade);
  p.rect(6, 0, 4, 3, C.greyLight); p.rect(7, 0, 2, 1, C.grey);             // clip
  ROWS.forEach((v, k) => {
    const isDone = k < done;
    p.rect(2, v, 3, 3, isDone ? C.green : C.paperShade);                  // tick box
    if (!isDone) p.rect(3, v + 1, 1, 1, C.paper);
    p.rect(6, v, k === 2 ? 6 : 8, 1, isDone ? C.paperShade : C.muted);       // task line
    p.rect(6, v + 2, k === 1 ? 5 : 4, 1, isDone ? C.paperShade : C.dim);
  });
  return p;
}

// Big "stamped" check: 2x version of fx.check with a dark outline so it pops off the desk.
const BIG_CHECK = [
  '..........KKK',
  '.........KGGK',
  '........KGGK.',
  '.KKK...KGGK..',
  'KGGK..KGGK...',
  '.KGGKKGGK....',
  '..KGGGGK.....',
  '...KGGK......',
  '....KK.......',
];
const MID_CHECK = [
  '......KK',
  '.....KGK',
  'KK..KGK.',
  'KGKKGK..',
  '.KGGK...',
  '..KK....',
];
function stampCheck(ctx, x, y, size) {
  if (size === 2) Iso.sprite(ctx, x - 6, y - 4, BIG_CHECK, { G: C.green, K: C.greenDark });
  else if (size === 1) Iso.sprite(ctx, x - 4, y - 3, MID_CHECK, { G: C.green, K: C.greenDark });
}

// Pose table.
const P = {
  look:   { eyes: { shape: 'open', gazeX: -1, gazeY: 1 }, arms: 'out' },
  nod:    { eyes: { shape: 'open', gazeX: -1, gazeY: 2 }, arms: 'out', mouth: 'smile' },
  crouch: { eyes: { shape: 'closed' }, arms: 'down', squash: 3, mouth: 'smile' },
  up:     { eyes: { shape: 'happy' }, arms: 'high', z: 6, squash: -3, mouth: 'smile' },
  apex:   { eyes: { shape: 'happy' }, arms: 'up', z: 13, squash: -1, mouth: 'laugh', blush: true },
  fall:   { eyes: { shape: 'happy' }, arms: 'high', z: 5, mouth: 'laugh', blush: true },
  land:   { eyes: { shape: 'closed' }, arms: 'out', squash: 4, mouth: 'smile', blush: true },
  settle: { eyes: { shape: 'happy' }, arms: 'out', squash: 1, mouth: 'smile', blush: true },
  yep:    { eyes: 'wink', arms: 'out', mouth: 'smile', blush: true },
  rest:   { eyes: 'open', arms: 'out' },
};
// [pose, holds]; ~1.0 s at 10 fps.
const TL = [
  ['look', 1], ['nod', 1],          // glance at the list
  ['crouch', 1],                    // anticipation
  ['up', 1], ['apex', 2], ['fall', 1],
  ['land', 1],                      // THUMP -> clipboard jumps, check stamped
  ['settle', 1], ['yep', 1],
  ['rest', 1],
];
const N = Iso.seq.len(TL);
const LAND = 7;   // frame index of 'land'

Iso.player({
  name: '09-hop-todo',
  fps: 10,
  frames: N,
  loop: false,
  notes: 'One-shot, 11 frames @ 10 fps (1.1 s). Clawd glances down at his clipboard, crouches, does one quick happy hop with arms high, ' +
    'and lands with a squash. <b>Gag:</b> the landing thump bounces the clipboard off the desk and stamps the next todo row green; ' +
    'a big check pops out of the board like a stamp, shrinks into a sparkle, and Clawd gives a little "yep!" wink. Ends on the neutral pose.',
  draw(ctx, i) {
    Iso.drawDesk(ctx);

    // --- clipboard: bounces on the landing impact, row 2 checks off at landing
    const cbZ = i === LAND ? 3 : i === LAND + 1 ? 1 : 0;
    if (cbZ) Iso.prop.shadow(ctx, CB.x + 1, CB.y, 9, 2);
    const board = todoBoard(ctx, CB.x, CB.y, cbZ, i >= LAND ? 2 : 1);
    const row2 = board.at(3, ROWS[1]);

    // --- Clawd
    const pose = P[Iso.seq(TL, i)];
    const a = Iso.drawClawd(ctx, Object.assign({ x: SPOT.clawd.x, y: SPOT.clawd.y }, pose));
    Iso.prop.mug(ctx, SPOT.mug.x, SPOT.mug.y, { frame: i });   // the mug spot is in front of him

    // --- landing dust ticks under the feet
    if (i === LAND) {
      Iso.fx.ticks(ctx, a.feet.x - 22, a.feet.y - 2, 'left', C.muted);
      Iso.fx.ticks(ctx, a.feet.x + 22, a.feet.y - 2, 'right', C.muted);
    }

    // --- stamped check: pops big out of the clipboard, then sparkles away
    const sx = row2.x + 1, sy = row2.y;
    if (i === LAND) {                                   // stamped right onto row 2
      stampCheck(ctx, sx + 2, sy - 2, 2);
      Iso.fx.sparkle(ctx, sx - 10, sy - 8, 1, C.amber);
      Iso.fx.sparkle(ctx, sx + 14, sy - 12, 1, C.green);
    } else if (i === LAND + 1) {                        // pops up off the board
      stampCheck(ctx, sx + 2, sy - 16, 1);
      Iso.fx.sparkle(ctx, sx - 12, sy - 14, 2, C.amber);
      Iso.fx.sparkle(ctx, sx + 14, sy - 20, 2, C.green);
    } else if (i === LAND + 2) {                        // ...and becomes a sparkle
      Iso.fx.sparkle(ctx, sx + 2, sy - 22, 3, C.green);
      Iso.fx.sparkle(ctx, sx - 12, sy - 18, 1, C.amber);
    } else if (i === LAND + 3) {
      Iso.fx.sparkle(ctx, sx + 2, sy - 25, 1, C.green);
    }

    // --- tiny motion ticks at take-off
    if (i === 3) Iso.fx.ticks(ctx, a.head.x, a.head.y - 6, 'up', C.orangeLight);
  },
});
</script>
</body>
</html>
