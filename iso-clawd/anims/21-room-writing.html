<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>21 Room writing</title>
<script src="../lib/iso.js"></script>
<script src="../lib/room.js"></script>
<script src="../lib/room/layout.js"></script>
<script src="../lib/room/light.js"></script>
<script src="../lib/room/walls.js"></script>
<script src="../lib/room/window.js"></script>
<script src="../lib/room/shelf.js"></script>
<script src="../lib/room/desk.js"></script>
<script src="../lib/room/lamp.js"></script>
<script src="../lib/room/monitor.js"></script>
<script src="../lib/room/clawd.js"></script>
<script src="../lib/room/chair.js"></script>
</head>
<body>
<script>
// WRITING CODE in the square office (Edit/Write). Clawd turns to the monitor (facing left) and types on the keyboard in
// front of it; the monitor faces him (we see its back), so the beats read from his hands, the keyboard and FX over the monitor's top. Built on 11-writing-code's typing engine with more beats so a long
// session doesn't loop the same slam every 4 s: type, stop and think (chin, dots), type, oops + backspace (wince, the
// line shrinks), type, flex the fingers, type, scroll back to read, type, the enter SLAM gag, proud, type, a sip without
// looking away, type. The loop length comes from the typing model (see SCR).
const { C, SHADE: SH } = Iso;
const P = Room.params();
const RP = Room.P;
const CL = { x: RP.clawd.x, y: RP.clawd.y };              // seated on his chair (the chair is drawn at Room.P.clawd)
const KEYB = RP.keyboard;                                 // keyboard on the desk, in front of Clawd (room/layout.js, same spot as Room.keyboard)

// ---- plan: [kind, frames, rate]. rate = px typed per frame | 'NL' | 'DEL' | 0
const PLAN = [
  ['type', 10, 2], ['think', 8, 0], ['type', 8, 2], ['oops', 2, 0], ['del', 4, 'DEL'], ['type', 6, 2], ['flex', 4, 0],
  ['type', 8, 2], ['scroll', 6, 0], ['type', 6, 2], ['hover', 2, 0], ['wind1', 1, 0], ['wind2', 2, 0], ['slam', 1, 'NL'],
  ['recoil', 1, 0], ['proud', 3, 0], ['type', 6, 2], ['reach', 1, 1], ['sip', 7, 1], ['putback', 1, 1], ['type', 6, 2],
];
const LINES = [[0, 10, C.violet], [2, 14, C.text], [2, 12, C.amber], [4, 12, C.blueLight]];   // [indent, len, colour]
const PERIOD = LINES.reduce((s, l) => s + l[1], 0);                                          // 48 px per 4 lines

const FR = [];
for (const [kind, n, rate] of PLAN) for (let k = 0; k < n; k++) FR.push({ kind, k, rate });

function stateOf(px) {
  let line = 0, p = px;
  while (p >= LINES[line % 4][1]) { p -= LINES[line % 4][1]; line++; }
  return { line, col: p };
}
// The monitor faces away from us (room/monitor.js has no screen): the typed 'code' is not drawn any more, but the
// typing model still sets the loop length (padding frames until the typed pixels fill a 4-line period), so the beats keep their timing.
const SCR = [];
(function build() {
  let px = 0, acc = 0;
  const step = (f) => {
    if (f.rate === 'NL') { const s = stateOf(px); px += LINES[s.line % 4][1] - s.col; }
    else if (f.rate === 'DEL') px = Math.max(0, px - 2);
    else { acc += f.rate; while (acc >= 1) { acc -= 1; px++; } }
    const s = stateOf(px);
    SCR.push({ line: s.line, col: s.col, slam: f.rate === 'NL', scroll: f.kind === 'scroll' ? [0, 1, 2, 2, 1, 0][f.k] : 0 });
  };
  FR.forEach(step);
  let rest = (PERIOD - (px % PERIOD)) % PERIOD;
  while (rest > 0) { const r = rest >= 2 ? 2 : 1; const f = { kind: 'type', k: 99, rate: r }; FR.push(f); step(f); rest -= r; }
})();
const FRAMES = FR.length;

// the desk keyboard (same size / colours as Room.keyboard in lib/room.js, so it doesn't change look between pages),
// hopping 1 px off the desk on the recoil; its shadow stays put
function keyboard(ctx, x, y, hop) {
  Room.shadow(ctx, x, y + 1, 10, 3, 0.35);
  const r = Iso.box(ctx, x, y, hop ? 1 : 0, 9, 4, 2, { top: '#AEB8BF', left: '#7C8890', right: '#5F6A72', edge: '#CDD5DA' });
  for (let i = 1; i < 8; i++) for (let j = 1; j < 3; j++) if ((i + j) % 2 === 0) r.top.cell(i, j, '#6E7C87');
}
// key clacks fly off the keys (anchored on the keyboard, on the side of the hand that is down)
const KEYS = (side) => ({ x: KEYB.x + (side ? 5 : 1), y: KEYB.y - 1 });   // on the keyboard's visible half (its left end is behind the monitor)
// the monitor's top edge (room/monitor.js panel: 15 units long, top 27 px above the foot): from its left end, 'dr'
const MON_TOP = { x: RP.monitor.x - 13, y: RP.monitor.y - 35, n: 15 };

function heldMug(ctx, x, y, i, steam) {
  Iso.sprite(ctx, x - 4, y - 5, ['.tttttt..', 'tcccccct.', 'llllrrrhh', 'llllrrr.h', 'llllrrr.h', 'llllrrrhh', 'llllrrr..', '.lllrr...'],
    { t: C.paper, c: C.woodRight, l: SH.paper.left, r: SH.paper.right, h: SH.paper.right });
  if (steam) {
    const f = i % 4, wig = [0, 1, 0, -1];
    for (let k = 0; k < 3; k++) {
      Iso.px(ctx, x - 2 + wig[(f + k) % 4], y - 7 - k * 2, k ? C.dim : C.muted);
      Iso.px(ctx, x + 1 + wig[(f + k + 2) % 4], y - 8 - k * 2, k ? C.dim : C.muted);
    }
  }
}

function clacks(ctx, hx, hy, i) {
  const spots = [[-3, -2], [1, -3], [-2, -3], [2, -2], [-4, -1], [0, -4]];
  for (let age = 0; age < 3; age++) {
    const j = i - age, [dx, dy] = spots[((j % 6) + 6) % 6], m = age + 1;
    const x = hx - 2 + dx * m, y = hy - 3 + dy * m;
    if (age === 0) Iso.rect(ctx, x, y, 2, 1, C.text); else if (age === 1) Iso.rect(ctx, x, y, 1, 1, C.text); else Iso.px(ctx, x, y, C.muted);
  }
}

function tongue(fp, k) {
  fp.rect(12, 18, 7, 1, C.eye);
  const u = 12 + (k % 2);
  fp.rect(u, 19, 3, 2, C.red); fp.px(u + 1, 19, C.blush); fp.rect(u + (k % 2 ? 0 : 1), 21, 2, 1, C.red);
}

const TYPE_EYES = { shape: 'open', gazeX: -1, gazeY: 0 };

Room.player({
  name: '21-room-writing',
  fps: 10,
  frames: FRAMES,
  loop: true,
  notes: 'WRITING CODE, ' + FRAMES + ' frames @ 10 fps. Clawd turns to the monitor and hammers the keyboard with alternating arms, tongue out, ' +
    'clacks flying off the keyboard. Beats between bursts: a pause to think (hand to chin, dots), an oops + backspace (wince, ' +
    'the hand recoils), a finger flex, a scroll back to re-read, the enter SLAM (wind-up, stretch, a flash over the monitor top, sparkle, check), ' +
    'a proud moment, and a sip without looking away. Same URL params as the other room pages.',
  draw(ctx, i) {
    const f = FR[i], kind = f.kind;
    const L = Room.draw(ctx, P.room, P.light);

    const alt = i % 2 === 0;
    const o = { x: CL.x, y: CL.y, facing: 'left', eyes: TYPE_EYES, arms: { l: alt ? 'typeA' : 'typeB', r: alt ? 'typeB' : 'typeA' } };
    let tongueOn = false, mugHeld = false;
    switch (kind) {
      case 'type':
        tongueOn = true; o.squash = i % 2; if (i % 4 === 1) o.shake = -1;
        if (f.k === 7) o.eyes = { shape: 'blink', gazeX: -1 };
        break;
      case 'think':
        o.arms = { l: 'typeB', r: 'up' }; o.eyes = { shape: 'open', gazeX: 0, gazeY: -2 }; o.mouth = 'flat';
        if (f.k === 5) o.eyes = { shape: 'blink' };
        break;
      case 'oops': o.arms = { l: 'typeB', r: 'typeB' }; o.eyes = { shape: 'wide', gazeX: -1 }; o.mouth = 'o'; o.squash = -2; break;
      case 'del': o.arms = { l: f.k & 1 ? 'typeA' : 'typeB', r: 'out' }; o.eyes = { shape: 'wince' }; o.mouth = 'wobbly'; o.shake = f.k & 1 ? 1 : -1; break;
      case 'flex': o.arms = { l: f.k < 2 ? 'high' : 'up', r: f.k < 2 ? 'high' : 'up' }; o.eyes = { shape: 'closed' }; o.mouth = 'smile'; o.squash = f.k < 2 ? -2 : 0; break;
      case 'scroll': o.arms = { l: 'typeB', r: 'forward' }; o.eyes = { shape: 'open', gazeX: -1, gazeY: f.k < 3 ? 0 : -1 }; o.mouth = 'flat'; break;
      case 'hover': o.arms = { l: 'typeB', r: 'typeB' }; o.eyes = { shape: 'open', gazeX: -1 }; o.mouth = 'flat'; break;
      case 'wind1': o.arms = { l: 'high', r: 'typeB' }; o.eyes = { shape: 'open', gazeX: -1, gazeY: -1 }; o.squash = -2; o.mouth = 'o'; break;
      case 'wind2': o.arms = { l: 'up', r: 'out' }; o.eyes = { shape: 'wide', gazeX: -1, gazeY: -1 }; o.squash = -4; o.mouth = 'o'; break;
      case 'slam': o.arms = { l: 'typeA', r: 'out' }; o.eyes = { shape: 'wince' }; o.squash = 5; o.mouth = 'flat'; break;
      case 'recoil': o.arms = { l: 'typeB', r: 'out' }; o.eyes = { shape: 'happy' }; o.squash = 2; o.mouth = 'laugh'; break;
      case 'proud': o.arms = { l: 'typeB', r: 'typeB' }; o.eyes = { shape: 'happy' }; o.mouth = 'smile'; o.blush = true; break;
      case 'reach': o.arms = { l: alt ? 'typeA' : 'typeB', r: 'forward' }; break;
      case 'sip': o.arms = { l: (i >> 1) % 2 ? 'typeA' : 'typeB', r: 'forward' }; mugHeld = true; if (f.k === 4) o.blush = true; break;
      case 'putback': o.arms = { l: alt ? 'typeA' : 'typeB', r: 'forward' }; break;
    }
    Room.chair(ctx);
    o.legs = (i >> 2) & 1 ? 'dangleB' : 'dangle'; o.z = Room.SEAT_Z; o.squash = Room.SEAT_SQUASH + (o.squash || 0);   // seated on the chair, feet swinging
    const a = Room.clawd(ctx, o);
    if (tongueOn) tongue(a.facePainter, i >> 1);
    Room.deskBack(ctx, L, { frame: i, keyboard: (c) => keyboard(c, KEYB.x, KEYB.y, kind === 'recoil') });   // our hopping keyboard, behind the monitor

    if (mugHeld) heldMug(ctx, a.mouth.x + 1, a.mouth.y + 1, i, true);
    else if (kind === 'reach' || kind === 'putback') heldMug(ctx, RP.mug.x, RP.mug.y - (kind === 'reach' ? 5 : 3), i, false);   // lifted off / set back on its spot
    Room.deskFront(ctx, i, { mug: !(mugHeld || kind === 'reach' || kind === 'putback') });

    // FX are self-lit (Room.unlit; the Iso.fx.* calls are wrapped automatically by Room.player)
    if (kind === 'type' || kind === 'reach' || kind === 'putback' || kind === 'del' || (kind === 'sip' && i % 2 === 0)) { const k = KEYS(i & 1); Room.unlit(ctx, () => clacks(ctx, k.x, k.y, i)); }
    if (kind === 'think') Iso.fx.dots(ctx, a.head.x + 14, a.head.y - 6, Math.min(3, (f.k >> 1) + 1), C.muted);
    if (kind === 'oops') Iso.fx.bang(ctx, a.head.x + 10, a.head.y - 8, { badge: false, color: C.red });
    if (kind === 'del') Iso.fx.ticks(ctx, KEYB.x - 12, KEYB.y - 3, 'left', C.red);
    if (kind === 'flex' && f.k < 2) { Iso.fx.ticks(ctx, a.hand.l.x - 2, a.hand.l.y - 4, 'up', C.muted); Iso.fx.ticks(ctx, a.hand.r.x + 2, a.hand.r.y - 4, 'up', C.muted); }
    if (kind === 'slam') {
      Room.unlit(ctx, () => {                                                          // the screen flashes: light bursts over the monitor's top edge
        Iso.isoLine(ctx, MON_TOP.x, MON_TOP.y - 1, MON_TOP.n, 'dr', C.glow);
        Iso.isoLine(ctx, MON_TOP.x + 4, MON_TOP.y - 1, MON_TOP.n - 4, 'dr', C.text);
      });
      Iso.fx.sparkle(ctx, MON_TOP.x + 16, MON_TOP.y + 2, 2, C.glow); Iso.fx.ticks(ctx, MON_TOP.x + 8, MON_TOP.y - 3, 'up', C.glow);
      Iso.fx.sparkle(ctx, KEYB.x - 4, KEYB.y - 5, 3, C.amber); Iso.fx.ticks(ctx, KEYB.x - 10, KEYB.y - 3, 'left', C.text); Iso.fx.ticks(ctx, a.head.x, a.head.y - 3, 'up', C.amber);
    }
    if (kind === 'recoil') { Iso.fx.sparkle(ctx, MON_TOP.x + 8, MON_TOP.y - 3, 2, C.amber); Iso.fx.sparkle(ctx, MON_TOP.x + 2, MON_TOP.y - 6, 1, C.text); }
    if (kind === 'recoil' || kind === 'proud') Iso.fx.check(ctx, MON_TOP.x + 14, MON_TOP.y - 6 - (kind === 'proud' ? 1 : 0), Room.mix(C.green, '#FFFFFF', 5));   // above the monitor's top edge
    if (kind === 'proud') Iso.fx.sparkle(ctx, MON_TOP.x + 6 + (i & 1) * 4, MON_TOP.y - 4, 1, C.amber);
  },
});
</script>
</body>
</html>
