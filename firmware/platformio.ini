; Claudius Maximus — desk companion firmware for the Waveshare ESP32-S3-Touch-LCD-4B (see src/core/board.h).
; Plain ESP-IDF 5.5 (pioarduino's framework-espidf package); no Arduino core. The IDF configuration is
; sdkconfig.defaults (the generated sdkconfig.<env> is not committed), the flash layout partitions.csv, LVGL and
; ArduinoJson come from the IDF component registry (src/idf_component.yml).
[platformio]
default_envs = companion

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 921600
; Project-wide compile options (-O2, LVGL config include path, warnings) live in CMakeLists.txt and
; sdkconfig.defaults. build_flags is for per-build experiment switches, e.g. -DHAL_STREAM_MODE=1,
; -DHAL_ROT180=0, -DLAYOUT_PAD=64 (docs/SCANOUT.md).
build_flags =

; Waveshare ESP32-S3-Touch-LCD-4B (TCA9554 expander, backlight PWM on GPIO4)
[env:companion]
