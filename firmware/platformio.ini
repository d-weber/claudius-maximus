; Claudius Maximus — desk companion firmware for the Waveshare ESP32-S3-Touch-LCD-4B (see src/core/board.h).
[platformio]
default_envs = companion

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
; -O2 instead of Arduino's -Os for our code + LVGL/GFX/JSON (measured ~5-10 % faster LVGL frames, +96 KB flash)
build_unflags = -Os
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0   ; host link uses the IDF usb_serial_jtag driver (core/link.cpp), not Arduino's HWCDC
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -I include
lib_deps =
  lvgl/lvgl@8.4.0
  moononournation/GFX Library for Arduino@1.5.3
  lewisxhe/SensorLib@0.2.6
  bblanchon/ArduinoJson@^7.2.0

; Waveshare ESP32-S3-Touch-LCD-4B (TCA9554 expander, backlight PWM on GPIO4)
[env:companion]
